# Apply one Supabase migration from a GitHub runner (the Claude sandbox cannot reach supabase.com).
# One-time setup by the operator: GitHub → Settings → Secrets and variables → Actions → New repository secret
#   SUPABASE_DB_URL = the project's connection string (Supabase → Project Settings → Database → Connection
#   string → URI, with the password filled in; the "Session" pooler URI works too).
# Then: Actions → "Apply Supabase migration" → Run workflow (default file = 036_sign_envelopes.sql), or ask MoT to trigger it.
name: Apply Supabase migration
on:
  workflow_dispatch:
    inputs:
      file:
        description: "migration file under supabase/migrations/"
        required: true
        default: "036_sign_envelopes.sql"
      project_ref:
        description: "(no secret set) Supabase project ref"
        required: false
        default: "ppgfjplawtlrfqpnszyb"
      db_password:
        description: "(no secret set) the database password (Project Settings → Database); masked in the log"
        required: false
        default: ""
      expect:
        description: "functions that must exist after the apply (comma list)"
        required: false
        default: "sign_envelope_create,sign_envelope_get,sign_envelope_sign"
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require the secret
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          REF: ${{ github.event.inputs.project_ref }}
          PW: ${{ github.event.inputs.db_password }}
        run: |
          # no secret? the ref + password inputs build the URL for this run only (the password is masked in the log, never stored)
          if [ -z "$DB" ] && [ -n "$REF" ] && [ -n "$PW" ]; then echo "::add-mask::$PW"; DB="postgresql://postgres:${PW}@db.${REF}.supabase.co:5432/postgres"; echo "SUPABASE_DB_URL=$DB" >> "$GITHUB_ENV"; echo "::add-mask::$DB"; fi
          if [ -z "$DB" ]; then
            echo "::error::SUPABASE_DB_URL secret is missing. Supabase → Project Settings → Database → Connection string (URI, with password) → add it as a repository secret named SUPABASE_DB_URL, then re-run."
            exit 1
          fi
      - name: Apply the migration
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -e
          f="supabase/migrations/${{ inputs.file }}"
          test -f "$f" || { echo "::error::$f not found"; exit 1; }
          echo "applying $f ($(wc -c < "$f") bytes)"
          psql "$DB" -v ON_ERROR_STOP=1 -f "$f"
          psql "$DB" -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema';"
      - name: Prove the functions exist
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          EXPECT: ${{ inputs.expect }}
        run: |
          set -e
          for fn in $(echo "$EXPECT" | tr ',' ' '); do
            n=$(psql "$DB" -Atc "select count(*) from pg_proc where proname = '$fn'")
            [ "$n" -ge 1 ] || { echo "::error::$fn not found after applying ${{ inputs.file }}"; exit 1; }
            echo "present: $fn"
          done
          echo "${{ inputs.file }} applied; expected functions present."
