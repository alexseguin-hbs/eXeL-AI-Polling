name: Deploy to Cloudflare

# Auto-deploy the static export to Cloudflare Workers static assets on every push to main
# (and on-demand via the Actions tab). Requires ONE repo secret: CLOUDFLARE_API_TOKEN
# (Settings → Secrets and variables → Actions). Optional: CLOUDFLARE_ACCOUNT_ID if the
# token spans multiple accounts. Until the secret is added, the deploy step fails loudly
# but changes nothing live — it's inert until you opt in.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static export (out/)
        working-directory: frontend
        env:
          NEXT_PUBLIC_GIT_SHA: ${{ github.sha }}
        run: npm run build

      - name: Deploy to Cloudflare (wrangler)
        working-directory: frontend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy
