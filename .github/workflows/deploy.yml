# Deploy to Cloudflare Workers on every push to main.
#
# WHY THIS EXISTS (AAR 2026-07-29): the Cloudflare git integration has never successfully deployed this Worker.
# Across 14 consecutive commit pairs the SAME commit built green on the preview branch and red on `main`, and the
# only Source that ever appears in Deployment History is "Wrangler" — i.e. a human running `wrangler deploy` by
# hand. Meanwhile the site served a 4-hour-old build while every push reported success. This workflow replaces
# that path with one that is versioned in the repo, reviewable, and — critically — FAILS LOUDLY instead of
# silently serving stale or degraded code.
#
# Three gates, in order, any of which stops the deploy:
#   envcheck  — required NEXT_PUBLIC_* present, or the bundle would ship with an empty Supabase client
#   build     — must actually print "Compiled successfully"; a zero exit code is not accepted as proof
#   verify    — the LIVE url must serve this commit's SHA, or the run is red
#
# Setup (once): Settings > Secrets and variables > Actions
#   CLOUDFLARE_API_TOKEN       token with "Workers Scripts: Edit" on this account
#   CLOUDFLARE_ACCOUNT_ID
#   NEXT_PUBLIC_SUPABASE_URL   NEXT_PUBLIC_SUPABASE_ANON_KEY     <- required; Trinity Redundancy depends on them
#   NEXT_PUBLIC_API_URL  NEXT_PUBLIC_WS_URL  NEXT_PUBLIC_AUTH0_*  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY  <- optional
# No secret value is ever written to a file or echoed in a log.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}          # manual re-deploy without a new commit

concurrency:                      # never let two deploys race for the same Worker
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend

jobs:
  # THE GATE (fleet r.147, MoT 2/11): every test the repo owns, on every push to main, in one job that is required.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      canbuild: ${{ steps.canbuild.outputs.ok }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # next.config.js falls back to `git rev-parse` for the SHA banner

      - uses: actions/setup-node@v4
        with:
          node-version: 22        # matches the Cloudflare build image (nodejs@22)
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` is strict about package.json <-> lock agreement. scripts/lockcheck.mjs (in prebuild) reports the
      # offending entries by name when they drift, instead of the opaque failure that broke every build earlier.
      - name: Install
        run: npm ci

      # Build parity, FIRST and in about a minute: the two checks Cloudflare's `next build` fails on (lint errors, type
      # errors). Its own step so a red gate names the cause — 2026-10-07 one unescaped apostrophe blocked every deploy for
      # hours behind a step called "Test (headless suites …)" while the cause was guessed instead of read.
      - name: Build parity (lint + types — what Cloudflare's next build fails on)
        run: npm run build:parity

      # FAIL CLOSED. Building without these produces a site that loads fine and whose live-response path is dead.


      # test:ci now carries the deck boot QA and the two-phone e2e (fleet r.147: "the gates run only after main"), so
      # Chromium is installed BEFORE it. The perf and crew runs come next, then spiral9 with perf REQUIRED, so an
      # unmeasured Scalability/Efficiency pillar is a red line here rather than a label (MoT 3).
      - name: Chromium for the headless gates
        run: npx playwright install --with-deps chromium

      - name: Test (headless suites — sign, pod, donate, lexicon, guards, deck boot QA, two-phone e2e)
        run: npm run test:ci

      # The perf and crew harnesses serve the static export, so the gate builds one of its own (no secrets: the drone routes need
      # none; the live-response path is the ship job's concern). postbuild counts the stamp and runs the render smoke here, where
      # Chromium exists — the first Deploy #965 under the split failed exactly here, waiting for an arena that was never exported.
      - name: Build the export for the headless gates (no secrets)
        env:
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
          SMOKE_REQUIRED: "1"
        run: |
          npm run build 2>&1 | tee /tmp/gate-build.log
          grep -q "Compiled successfully" /tmp/gate-build.log || { echo "::error::gate build did not report 'Compiled successfully'"; exit 1; }
      - name: Drone perf + crew (measured, before the scorer reads them)
        run: |
          npm run test:drone-perf
          npm run test:drone-crew
      - name: Drone determinism (SPIRAL ×9, SSSES from measurements only)
        env:
          SPIRAL_REQUIRE_PERF: "1"
        run: npm run test:drone-spiral9

      # Cloudflare's git build is the door that actually ships, and its prebuild now runs the two Sign Doc gates.
      # This job's remaining value is the FULL test:ci above. When the two Supabase build vars are not present as Actions
      # secrets, the build+deploy half cannot produce a working bundle, so it is SKIPPED and said out loud rather than failed:
      # a permanently red light teaches everyone to ignore the one that matters (operator 2026-09-10).
      - name: Can this runner build a working bundle?
        id: canbuild
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$NEXT_PUBLIC_SUPABASE_URL" ] && [ -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Build vars present — this run gates AND deploys."
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "## SHIP SKIPPED — the Supabase build vars are not set as Actions secrets; Cloudflare's git build is the only deployer of this sha" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice title=Deploy skipped::The Supabase build vars are not set as Actions secrets, so this runner cannot"
            echo "::notice::produce a working bundle. The tests above still gated this commit. Cloudflare's git build ships the"
            echo "::notice::site and its prebuild runs the Sign Doc invariant and voice gates. Set the two secrets to deploy here too."
          fi

  # THE BACKEND GATE (AsM round 1, 2026-10-07 — Odin, Enlil, Athena): the ~3,350-test backend suite, the Postgres SQL-tally
  # parity proof, the sim_seed tests and the live-database proofs (tests/live_db: every OpenAPI operation without a 500, the
  # 38-step journey, the HP-21 Admin Console sequence) had never run in CI. They run here, on every push to main, against a
  # real health-checked Postgres, and the ship job waits on them. Runs in parallel with the frontend gate.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: polling
          POSTGRES_PASSWORD: polling
          POSTGRES_DB: polling_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U polling -d polling_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://polling:polling@localhost:5432/polling_db
      SIM_TEST_DSN: postgresql://polling:polling@localhost:5432/sim_parity
      LIVE_DB_DSN: postgresql://polling:polling@localhost:5432/live_db_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # requirements.txt minus the four heavy runtime-only extras the suite never imports: torch + transformers (the
      # Cube 2 NER model is lazy-loaded; installing transformers would make PII tests download a 2 GB model) and the
      # Azure / AWS speech SDKs (lazy-imported inside the paid STT providers, which the suite mocks).
      - name: Install backend requirements (no heavy ML / cloud-STT extras)
        run: |
          grep -viE '^(torch|transformers|azure-cognitiveservices-speech|boto3)\b' requirements.txt > /tmp/requirements-ci.txt
          python -m pip install --upgrade pip
          python -m pip install -r /tmp/requirements-ci.txt "pytest>=8.3.0" "pytest-asyncio>=0.25.0"

      # Fail closed: the Postgres-backed proofs skip when no database answers, so prove the service answers first —
      # a green run must never mean "skipped for want of a database".
      - name: Postgres answers
        run: python -c "import asyncio, asyncpg; asyncio.run(asyncpg.connect('postgresql://polling:polling@localhost:5432/postgres', timeout=10))"

      - name: Backend suite (unit + SQL-tally parity + sim_seed + live-database proofs)
        run: |
          set -o pipefail
          python -m pytest -q -rfEs -p no:cacheprovider 2>&1 | tee /tmp/backend-pytest.log

      # A failure must be readable without the raw log (which some reviewers cannot reach): each failing test (-rfEs puts
      # the FAILED/ERROR lines in the summary; -rs alone listed only skips, so 0dee0ad failed with no name)
      # becomes an annotation on the check, with pytest's one-line reason.
      - name: Name the failing tests
        if: failure()
        run: |
          grep -E "^(FAILED|ERROR) " /tmp/backend-pytest.log | head -40 | while IFS= read -r line; do
            echo "::error title=backend test::${line}"
          done || true
          # A run that dies without naming a test (crash, collection error, killed worker) still says why:
          # the log's last lines become one annotation (a812b4f and 95f8a82 failed with no FAILED line).
          if ! grep -qE "^(FAILED|ERROR) " /tmp/backend-pytest.log; then
            tail -n 25 /tmp/backend-pytest.log | tr -d '\r' | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' > /tmp/backend-tail.txt
            echo "::error title=backend run ended without a named test::$(cat /tmp/backend-tail.txt)"
          fi

      - name: The live-database proofs actually ran (not skipped)
        run: |
          if grep -E "SKIPPED .*(tests/live_db/|test_sql_tally_parity|test_ballot_cycle)" /tmp/backend-pytest.log; then
            echo "::error::a Postgres-backed proof skipped although the service is up"; exit 1
          fi

  # THE SHIP (operator 2026-09-23: the four secrets will be set). A job-level `if` on the gate's output means a run without
  # the secrets shows this job SKIPPED — grey, a fourth state — never a green "Deploy" that shipped nothing (MoT 11).
  # It also waits on the backend gate: a red backend suite stops the deploy exactly as a red frontend gate does.
  ship:
    needs: [gate, backend]
    if: needs.gate.outputs.canbuild == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Chromium for the render smoke
        run: npx playwright install --with-deps chromium

      - name: Check required build vars
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_AUTH0_DOMAIN: ${{ secrets.NEXT_PUBLIC_AUTH0_DOMAIN }}
          NEXT_PUBLIC_AUTH0_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_AUTH0_CLIENT_ID }}
          NEXT_PUBLIC_AUTH0_AUDIENCE: ${{ secrets.NEXT_PUBLIC_AUTH0_AUDIENCE }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
        run: node scripts/envcheck.mjs

      - name: Test
        run: npm run test:innovation-time

      # A build that exits 0 without compiling is exactly how a broken deploy got shipped before. Require the words.
      - name: Build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_WS_URL: ${{ secrets.NEXT_PUBLIC_WS_URL }}
          NEXT_PUBLIC_AUTH0_DOMAIN: ${{ secrets.NEXT_PUBLIC_AUTH0_DOMAIN }}
          NEXT_PUBLIC_AUTH0_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_AUTH0_CLIENT_ID }}
          NEXT_PUBLIC_AUTH0_AUDIENCE: ${{ secrets.NEXT_PUBLIC_AUTH0_AUDIENCE }}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          WORKERS_CI_COMMIT_SHA: ${{ github.sha }}
        run: |
          npm run build 2>&1 | tee /tmp/build.log
          grep -q "Compiled successfully" /tmp/build.log \
            || { echo "::error::build did not report 'Compiled successfully'"; exit 1; }

      # The screen a stranger opens, in a real browser, from the export that is about to ship: mounts, no thrown error.
      # 2026-09-23: this is what caught the build stamp sampled in two processes (HTML 14:50, chunks 14:51 → React #425
      # on every 2525 surface). It needs out/, so it runs here, after Build and before Deploy.
      - name: Render smoke on the export (the drone UI mounts with no page error)
        run: npm run test:drone-render-smoke

      # `deploy` uploads AND routes 100% of traffic. `versions upload` stages at 0% and is what left the site
      # serving a stale version while every build looked fine. Do not change this verb.
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: frontend
          command: deploy

      # A deploy is not a ship. Cloudflare's edge needs a moment to propagate, so poll rather than fail on the
      # first miss — but if it never matches, the run goes RED. That is the whole point.
      - name: Verify live site serves ${{ github.sha }}
        run: |
          for i in 1 2 3 4 5 6; do
            if node scripts/verify-deploy.mjs "${{ github.sha }}"; then exit 0; fi
            echo "not live yet (attempt $i/6) — waiting 15s"; sleep 15
          done
          echo "::error::deployed, but the live site never served ${{ github.sha }}"
          exit 1
