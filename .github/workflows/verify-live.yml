# What is the live site serving, and is it the commit we want? — the answer, on demand, with NO secrets required.
#
# WHY: the Claude Code sandbox cannot reach the site host (it is outside the environment's allowed network domains), so an
# agent working there cannot read the deployed site directly. It CAN read api.github.com. GitHub's runners have full network,
# so this workflow performs the check the sandbox can't and records the verdict where the agent reads it: the LIVE STATE
# step below publishes ONE line on every run — a check-run annotation, the step summary and an artifact — naming what the
# site serves, which branches carry it, what Cloudflare holds active and unpromoted, and when it was read. It never fails.
# (Operator 2026-10-31: "make sure you know what architect-2525 is live always" — for a week the compare below said STALE
# 000fe42 every half hour and nobody read it; the line now exists to be read: frontend/scripts/status.mjs reads it.)
#
# Then the compare: WANT = the `want` input → frontend/deploy.json productionBranch → github.sha. A STALE verdict names what
# IS live. Deliberately separate from deploy.yml: that one needs CLOUDFLARE_API_TOKEN and the NEXT_PUBLIC_* secrets. This
# one needs nothing (the Cloudflare read in LIVE STATE is optional and says UNREAD when the secrets are absent).

name: Verify Live

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      want:
        description: "sha or branch to expect live (default: frontend/deploy.json productionBranch, else this sha)"
        required: false
        default: ""
  schedule:
    - cron: "*/30 * * * *"     # catch a deploy that silently stops promoting

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # the branches that contain the live sha; origin/<branch> for WANT

      # KNOW WHAT IS LIVE, ALWAYS. This step NEVER fails and ALWAYS publishes one line.
      - name: LIVE STATE (never fails)
        id: live
        continue-on-error: true
        shell: bash
        env:
          SITE: https://exel-ai-polling.explore-096.workers.dev
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          stamp() { # $1=url → "sha|date|time|v0001": the banner app/layout.tsx renders (SHA: · Date: · Time:) and the v0.001 footer
            local h s d t v
            h="$(curl -sS -m 20 -H 'cache-control: no-cache' "$1" || true)"
            s="$(printf '%s' "$h" | grep -oE 'SHA:[^<0-9a-f]{0,8}(<[^>]*>[^<0-9a-f]{0,8})?[0-9a-f]{7}' | grep -oE '[0-9a-f]{7}$' | head -1)"
            d="$(printf '%s' "$h" | grep -oE 'Date:[^<]{0,8}(<[^>]*>)?[^<]{0,8}[0-9]{4}\.[0-9]{2}\.[0-9]{2}' | grep -oE '[0-9]{4}\.[0-9]{2}\.[0-9]{2}$' | head -1)"
            t="$(printf '%s' "$h" | grep -oE 'Time:[^<]{0,8}(<[^>]*>)?[^<]{0,8}[0-9]{2}:[0-9]{2} CST' | grep -oE '[0-9]{2}:[0-9]{2} CST$' | head -1)"
            v="$(printf '%s' "$h" | grep -oE 'v0\.001-[0-9.]+-[0-9.]+CST' | head -1)"
            printf '%s|%s|%s|%s' "${s:-none}" "${d:--}" "${t:--}" "${v:--}"
          }
          PREVIEW="$(node -e "process.stdout.write(require('./frontend/deploy.json').previewAlias||'')")"
          ROOT="$(stamp "$SITE/")"; ARCH="$(stamp "$SITE/Architect-2525/")"
          if [ -n "$PREVIEW" ]; then PREV="$(stamp "$PREVIEW/Architect-2525/")"; else PREV="none|-|-|-"; fi
          live="${ROOT%%|*}"; rest="${ROOT#*|}"; ldate="${rest%%|*}"; rest="${rest#*|}"; ltime="${rest%%|*}"
          arch="${ARCH%%|*}"; archv="${ARCH##*|}"; prev="${PREV%%|*}"
          branches="none-in-clone"
          if [ "$live" != "none" ] && git rev-parse -q --verify "$live^{commit}" >/dev/null 2>&1; then
            branches="$(git branch -r --contains "$live" --format='%(refname:short)' | sed 's#^origin/##' | grep -v '^HEAD$' | paste -sd, -)"
            [ -z "$branches" ] && branches="none-in-clone"
          fi
          # Cloudflare: the active production deployment and the newest Ready version that is NOT in it (built, never promoted).
          # Read only when the two secrets exist — their existence is asserted, not proven (the Actions ship job never ran); the
          # first run prints the raw JSON heads so the field names can be written down here and in the gate fixture.
          cf_active="UNREAD(secrets absent)"; cf_unpromoted="UNREAD"
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            ( cd frontend && npx --yes wrangler@4.115.0 deployments list --json > /tmp/cf-dep.json 2>/tmp/cf-dep.err || true
              npx --yes wrangler@4.115.0 versions list --json > /tmp/cf-ver.json 2>/tmp/cf-ver.err || true )
            echo "--- cloudflare deployments (head)"; head -c 600 /tmp/cf-dep.json 2>/dev/null || true; echo
            echo "--- cloudflare versions (head)"; head -c 600 /tmp/cf-ver.json 2>/dev/null || true; echo
            parsed="$(node -e '
              const fs=require("fs"); const rd=(f)=>{try{return JSON.parse(fs.readFileSync(f,"utf8"))}catch{return null}};
              const dep=rd("/tmp/cf-dep.json"), ver=rd("/tmp/cf-ver.json");
              const deps=Array.isArray(dep)?dep:(dep&&(dep.deployments||dep.result))||[]; const vers=Array.isArray(ver)?ver:(ver&&(ver.versions||ver.result))||[];
              const when=(x)=>Date.parse(x&&(x.created_on||x.created||x.createdOn||x.timestamp)||0)||0;
              const id=(v)=>String(v.version_id||v.versionId||v.id||"?"); const msg=(x)=>String((x&&x.annotations&&(x.annotations["workers/message"]||x.annotations.message))||(x&&x.message)||"").slice(0,48);
              const newestDep=[...deps].sort((a,b)=>when(b)-when(a))[0]; let active="UNREAD(no-deployments)", ids=new Set();
              if(newestDep){ const vs=newestDep.versions||[]; ids=new Set(vs.map(id)); active=vs.map((v)=>`${id(v).slice(0,8)}@${v.percentage??v.percent??"?"}%`).join("+")+(msg(newestDep)?`"${msg(newestDep)}"`:""); }
              const newestVer=[...vers].sort((a,b)=>when(b)-when(a))[0]; let unp="none";
              if(newestVer && !ids.has(id(newestVer))) unp=`${id(newestVer).slice(0,8)}"${msg(newestVer)}"`;
              process.stdout.write(active.replace(/\s+/g,"_")+" "+unp.replace(/\s+/g,"_"));
            ' 2>/dev/null || echo "UNREAD(parse) UNREAD(parse)")"
            cf_active="${parsed%% *}"; cf_unpromoted="${parsed#* }"
          fi
          read_at="$(date -u +%Y-%m-%dT%H:%MZ)"
          LINE="LIVE STATE · live=$live built $ldate $ltime · arch=$arch $archv · branches=$branches · cf.active=$cf_active · cf.unpromoted=$cf_unpromoted · preview=$prev · read=$read_at"
          echo "$LINE"
          echo "::notice title=LIVE STATE::$LINE"
          { echo "### LIVE STATE"; echo '`'"$LINE"'`'; echo "(built = the commit clock of the served sha, not the promotion time)"; } >> "$GITHUB_STEP_SUMMARY"
          node -e 'const [live,ldate,ltime,arch,archv,branches,cfa,cfu,prev,read]=process.argv.slice(1); require("fs").writeFileSync("live-state.json", JSON.stringify({live,built:`${ldate} ${ltime}`,arch,archVersion:archv,branches:branches.split(","),cfActive:cfa,cfUnpromoted:cfu,preview:prev,read},null,2)+"\n")' "$live" "$ldate" "$ltime" "$arch" "$archv" "$branches" "$cf_active" "$cf_unpromoted" "$prev" "$read_at"
          { echo "LIVE_SHA=$live"; echo "LIVE_DATE=$ldate"; echo "LIVE_TIME=$ltime"; echo "LIVE_BRANCHES=$branches"; echo "CF_ACTIVE=$cf_active"; echo "CF_UNPROMOTED=$cf_unpromoted"; } >> "$GITHUB_ENV"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-state
          path: live-state.json
          if-no-files-found: warn

      # WANT: the `want` input (a sha or a branch) → frontend/deploy.json productionBranch → this sha. The compare below is
      # against the branch Cloudflare actually promotes, not whatever ref the cron happens to run on.
      - name: Resolve WANT (input → frontend/deploy.json productionBranch → github.sha)
        id: want
        shell: bash
        env:
          WANT_INPUT: ${{ inputs.want }}
          GITHUB_SHA_IN: ${{ github.sha }}
        run: |
          w="$WANT_INPUT"; src="input"
          if [ -z "$w" ]; then w="$(node -e "process.stdout.write(require('./frontend/deploy.json').productionBranch||'')")"; src="deploy.json"; fi
          if [ -z "$w" ]; then w="$GITHUB_SHA_IN"; src="github.sha"; fi
          if printf '%s' "$w" | grep -Eq '^[0-9a-f]{7,40}$'; then sha="$(git rev-parse -q --verify "$w^{commit}" || true)"
          else sha="$(git rev-parse -q --verify "origin/$w^{commit}" || true)"; fi
          if [ -z "$sha" ]; then echo "::error title=WANT::'$w' ($src) is neither a reachable sha nor a remote branch"; exit 1; fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "sha7=${sha:0:7}" >> "$GITHUB_OUTPUT"; echo "source=$src($w)" >> "$GITHUB_OUTPUT"
          echo "want=${sha:0:7} from $src($w)"

      # Cloudflare builds then promotes; give it room before calling it stale. Reports the SHA it actually
      # sees on every attempt, so the log is a deployment timeline rather than a single pass/fail.
      # Hosted migration 036 — measured after every deploy, never assumed (fleet pass 2, Athena). Runs only when the two
      # secrets exist (Settings → Secrets → SUPABASE_URL, SUPABASE_ANON_KEY); a missing migration is a WARNING, not a
      # failure — signing still works on one phone, the hand-off link does not.
      - name: Probe hosted migration 036 (optional)
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          body="$(curl -sS -m 20 -X POST "$SUPABASE_URL/rest/v1/rpc/sign_envelope_get" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H 'content-type: application/json' \
            --data '{"p_token":"probe","p_secret":null,"p_ip_hash":null,"p_user_agent":"verify-live"}' || true)"
          if printf '%s' "$body" | grep -q 'PGRST202'; then
            echo "::warning title=036 MISSING::sign_envelope_get is not on this Supabase — apply migration 036 (Sign Doc → Why can't I sign? → Copy migration SQL)"
            echo "### ⚠ migration 036 not applied on hosted Supabase" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=036 OK::sign_envelope_get answers on hosted Supabase"
            echo "### ✅ migration 036 answers" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Poll live site for ${{ steps.want.outputs.sha7 }}
        env:
          SITE: https://exel-ai-polling.explore-096.workers.dev
          WANT: ${{ steps.want.outputs.sha }}
          WANT_SOURCE: ${{ steps.want.outputs.source }}
        run: |
          want7="${WANT:0:7}"
          echo "expecting: $want7"
          for i in $(seq 1 30); do
            html="$(curl -sS -m 20 -H 'cache-control: no-cache' "$SITE" || true)"
            # The stamp, read where the layout renders it (SHA: <span>sha</span>); NO fallback to "the first 7-hex word" —
            # that fallback matched by luck for a week (fleet r.147, Krishna). A miss is red.
            # The layout renders `SHA:&nbsp;<span class="…">sha</span>` — a NON-BREAKING space (U+00A0), then a span whose class holds
            # hex letters. So: after "SHA:", up to 8 characters that are neither a tag nor hex, an optional tag, the same again, then the sha.
            live="$(printf '%s' "$html" | grep -oE 'SHA:[^<0-9a-f]{0,8}(<[^>]*>[^<0-9a-f]{0,8})?[0-9a-f]{7}' | grep -oE '[0-9a-f]{7}$' | head -1)"
            echo "attempt $i/30 — live=${live:-none}"
            if [ "$live" = "$want7" ]; then
              echo "LIVE=$live" >> "$GITHUB_ENV"
              echo "::notice title=LIVE::$SITE is serving $live"
              echo "### ✅ LIVE — \`$live\`" >> "$GITHUB_STEP_SUMMARY"
              echo "$SITE is serving this commit." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 30
          done
          echo "::error title=STALE::want $want7 ($WANT_SOURCE) · live=${LIVE_SHA:-${live:-none}} built ${LIVE_DATE:--} ${LIVE_TIME:--} on [${LIVE_BRANCHES:-?}] · cf.active=${CF_ACTIVE:-?} · cf.unpromoted=${CF_UNPROMOTED:-?}"
          {
            echo "### ❌ STALE"
            echo "Wanted \`$want7\` ($WANT_SOURCE); the live site serves \`${LIVE_SHA:-${live:-none}}\` (built ${LIVE_DATE:--} ${LIVE_TIME:--}, on [${LIVE_BRANCHES:-?}]) after 15 minutes."
            echo "Cloudflare active: ${CF_ACTIVE:-?} · newest unpromoted: ${CF_UNPROMOTED:-?}"
            echo ""
            echo "Cloudflare built but did not promote, or the build failed, or the live build is from another branch."
            echo "Remedy: if cf.unpromoted names a version, Workers & Pages → exel-ai-polling → Deployments → promote it to 100%;"
            echo "if branches= lacks the production branch, the live build came from another branch (promote the right one);"
            echo "or clear the build cache (Settings → Build → Clear build cache) and retry."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # THE ROUTE, NOT JUST THE ROOT (Round 10, R10-1). For three days "Verify Live passed" meant the site root
      # carried the SHA; it never once requested /drone-2525/, the page the operator keeps pasting. A route that
      # 404s on the live host while the root is green is precisely the failure this workflow exists to catch.
      # Asserted by the arena's own markup (data-drone-ux1), not by any 200 — a soft-404 SPA shell is a 200 too.
      - name: Probe /drone-2525/ on the live site
        env:
          SITE: https://exel-ai-polling.explore-096.workers.dev
        run: |
          code="$(curl -sS -m 20 -o /tmp/drone.html -w '%{http_code}' -H 'cache-control: no-cache' "$SITE/drone-2525/" || echo 000)"
          if [ "$code" = "200" ] && grep -q 'data-drone-ux1' /tmp/drone.html; then
            echo "::notice title=ROUTE::$SITE/drone-2525/ answers 200 with the arena markup"
            echo "### ✅ /drone-2525/ answers (200, arena markup present)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=ROUTE::$SITE/drone-2525/ returned $code (arena markup $(grep -q 'data-drone-ux1' /tmp/drone.html && echo present || echo ABSENT))"
            echo "### ❌ /drone-2525/ does not answer — HTTP $code" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # ARCHITECT-2525 ON THE EDGE (operator 2026-10-31: "make sure you know what architect-2525 is live always"): the route
      # answers with its own markup and the wanted stamp; the one Worker redirect lands a legacy "main" address on the canonical
      # one with its query intact (R5); the geolocation header that broke GPS for a week reads (self) (R5). Each line is one he can
      # check on his phone.
      - name: Probe /Architect-2525/ on the live site (markup · stamp · the /main redirect · geolocation)
        shell: bash
        env:
          SITE: https://exel-ai-polling.explore-096.workers.dev
          WANT7: ${{ steps.want.outputs.sha7 }}
        run: |
          code="$(curl -sS -m 20 -o /tmp/arch.html -w '%{http_code}' -H 'cache-control: no-cache' "$SITE/Architect-2525/" || echo 000)"
          st="$(grep -oE 'SHA:[^<0-9a-f]{0,8}(<[^>]*>[^<0-9a-f]{0,8})?[0-9a-f]{7}' /tmp/arch.html | grep -oE '[0-9a-f]{7}$' | head -1)"
          if [ "$code" = "200" ] && grep -q 'data-arch-ribbon' /tmp/arch.html && [ "$st" = "$WANT7" ]; then
            echo "::notice title=ARCH ROUTE::$SITE/Architect-2525/ answers 200 with the Architect ribbon, stamp $st"
          else
            echo "::error title=ARCH ROUTE::/Architect-2525/ → HTTP $code, ribbon $(grep -q 'data-arch-ribbon' /tmp/arch.html && echo present || echo ABSENT), stamp ${st:-none} (want $WANT7)"; exit 1
          fi
          r="$(curl -sS -m 20 -o /dev/null -w '%{http_code} %{redirect_url}' "$SITE/main/Architect-2525/?q=1")"   # main-redirect-probe
          if [ "$r" = "301 $SITE/Architect-2525/?q=1" ]; then echo "::notice title=ARCH ROUTE::/main/Architect-2525/?q=1 → 301 $SITE/Architect-2525/?q=1"   # main-redirect-probe
          else echo "::error title=ARCH ROUTE::/main/Architect-2525/?q=1 → $r (want 301 $SITE/Architect-2525/?q=1 — worker.js)"; exit 1; fi   # main-redirect-probe
          pp="$(curl -sSI -m 20 "$SITE/Architect-2525/" | tr -d '\r' | awk -F': ' 'tolower($1)=="permissions-policy"{print $2}')"
          case "$pp" in *'geolocation=()'*) echo "::error title=ARCH ROUTE::Permissions-Policy carries geolocation=() again — GPS is dead on every page"; exit 1;; esac
          case "$pp" in
            *'geolocation=(self)'*) echo "::notice title=ARCH ROUTE::Permissions-Policy on /Architect-2525/ allows geolocation=(self)" ;;
            *) echo "::error title=ARCH ROUTE::Permissions-Policy on /Architect-2525/ is '${pp:-none}' — geolocation=(self) missing (public/_headers)"; exit 1 ;;
          esac
          echo "### ✅ /Architect-2525/ answers with its ribbon and stamp $st · /main redirect 301 · geolocation=(self)" >> "$GITHUB_STEP_SUMMARY"

      # 2026.10.17 · IS _headers ACTUALLY HONOURED? The cache class was fixed in public/_headers on the
      # reasoning that Workers Static Assets reads it — but that reasoning is not provable from inside the
      # sandbox, which 403s every host. If it is NOT honoured, then the two earlier per-file no-cache fixes
      # (the living document r143, the operator deck r.202) were never in force either, and he has been
      # hard-refreshing to work around a rule that does nothing. This step answers it empirically, on every
      # run, from a runner with real network — which is better than a documentation link.
      - name: Does the live site revalidate its documents? (the cache class)
        env:
          SITE: https://exel-ai-polling.explore-096.workers.dev
        run: |
          set -o pipefail
          bad=0
          for path in "/SoI-2525/" "/Security-2525/" "/financial-2525/" "/drone-2525/play.html"; do
            cc="$(curl -sSI -m 20 "$SITE$path" | tr -d '\r' | awk -F': ' 'tolower($1)=="cache-control"{print tolower($2)}')"
            case "$cc" in
              *no-cache*) echo "::notice title=CACHE::$path → $cc" ;;
              "")         echo "::error title=CACHE::$path carries NO Cache-Control — _headers is not reaching the edge"; bad=1 ;;
              *)          echo "::error title=CACHE::$path → $cc (expected no-cache; a document he reloads can be stale)"; bad=1 ;;
            esac
          done
          # the other half of the bargain: hashed bundles must still be cached hard, or every load re-downloads them
          asset="$(curl -fsSL -m 25 -H 'cache-control: no-cache' "$SITE/" | grep -oE '/_next/static/[^"]+\.js' | head -1 || true)"
          if [ -n "$asset" ]; then
            acc="$(curl -sSI -m 20 "$SITE$asset" | tr -d '\r' | awk -F': ' 'tolower($1)=="cache-control"{print tolower($2)}')"
            # EXCLUSIVITY, not presence. The first version of this probe asked only whether the header
            # CONTAINED "immutable" and so it passed on
            #     no-cache, must-revalidate, public, max-age=31536000, immutable
            # which is what _headers concatenation produced — and no-cache wins, so the year was dead while
            # the probe stayed green. A long cache must have nothing contradicting it.
            case "$acc" in
              *no-cache*|*no-store*) echo "::error title=CACHE::$asset → $acc — a long cache CONTRADICTED; no-cache wins and the immutable year is dead"; bad=1 ;;
              *immutable*)           echo "::notice title=CACHE::$asset → $acc" ;;
              *)                     echo "::error title=CACHE::$asset → ${acc:-none} (expected immutable)"; bad=1 ;;
            esac
          else
            echo "::warning title=CACHE::could not find a hashed asset on / to probe"
          fi
          if [ "$bad" = "1" ]; then
            echo "### ❌ The cache class — a document can still be served stale" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          echo "### ✅ Documents revalidate, hashed assets stay immutable" >> "$GITHUB_STEP_SUMMARY"

      # DD-57 (operator 2026-10-14: "ensure supabase is linked"). The two NEXT_PUBLIC_ vars are inlined into the client
      # bundle at build time, so the ONLY honest proof that the live site has them is to read what the site actually serves.
      # deploy.yml:18 states the stake: "required; Trinity Redundancy depends on them" — without them lib/supabase.ts:6-9
      # returns null, and per CLAUDE.md's locked table send paths A+B and receive channels A, B and D all die, leaving the
      # CF KV pair alone: 3x4 redundancy silently reduced to 1x1. Measured, never asserted. The anon key is never printed.
      - name: Is Supabase linked on the LIVE site?
        env:
          SITE: https://exel-ai-polling.explore-096.workers.dev
        run: |
          set -o pipefail
          html="$(curl -fsSL -m 25 -H 'cache-control: no-cache' "$SITE/" || true)"
          if [ -z "$html" ]; then
            echo "::error title=SUPABASE::could not fetch $SITE/ — cannot prove the link either way"
            echo "### ❌ Supabase — UNVERIFIED, the site did not answer" >> "$GITHUB_STEP_SUMMARY"; exit 1
          fi
          # the chunks the page loads; the inlined config lives in one of them
          chunks="$(printf '%s' "$html" | grep -oE '/_next/static/[^"]+\.js' | sort -u | head -40)"
          found_url=""; found_key=0; scanned=0
          for c in $chunks; do
            body="$(curl -fsSL -m 25 "$SITE$c" || true)"; [ -z "$body" ] && continue
            scanned=$((scanned+1))
            u="$(printf '%s' "$body" | grep -oE 'https://[a-z0-9]{12,}\.supabase\.co' | head -1 || true)"
            [ -n "$u" ] && [ -z "$found_url" ] && found_url="$u"
            # the anon key is a JWT; prove its PRESENCE only, never its value
            printf '%s' "$body" | grep -qE 'eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}' && found_key=1
          done
          ref="$(printf '%s' "$found_url" | sed -E 's#https://([a-z0-9]{4})[a-z0-9]+\.supabase\.co#\1…#')"
          echo "scanned $scanned chunk(s) of $(printf '%s' "$chunks" | wc -w)"
          if [ -n "$found_url" ] && [ "$found_key" = "1" ]; then
            echo "::notice title=SUPABASE::linked — the live bundle carries a Supabase project URL ($ref) and an anon key"
            echo "### ✅ Supabase is linked on the live site — project \`$ref\`, anon key present (value never printed)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=SUPABASE::NOT linked — url=$([ -n "$found_url" ] && echo present || echo ABSENT) key=$([ "$found_key" = 1 ] && echo present || echo ABSENT)"
            {
              echo "### ❌ Supabase is NOT linked on the live site"
              echo ""
              echo "| | |"; echo "|---|---|"
              echo "| project URL in the bundle | $([ -n "$found_url" ] && echo "present ($ref)" || echo '**ABSENT**') |"
              echo "| anon key in the bundle | $([ "$found_key" = 1 ] && echo present || echo '**ABSENT**') |"
              echo ""
              echo "\`lib/supabase.ts\` therefore exports \`null\`. Per CLAUDE.md's Trinity Redundancy table that kills send"
              echo "paths **A** (Broadcast) and **B** (DB INSERT) and receive channels **A**, **B** and **D** — leaving only the"
              echo "Cloudflare KV pair. **Fix:** set \`NEXT_PUBLIC_SUPABASE_URL\` and \`NEXT_PUBLIC_SUPABASE_ANON_KEY\` as build"
              echo "variables in the **Cloudflare Workers Builds** project (Cloudflare is the only deployer — the Actions \`ship\`"
              echo "job is skipped without them), then redeploy."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Verify the served operator deck (the playable itself, not just the shell route)
        # r.133: this step ran without SITE since r.131 (curl "No host part") and grepped a label the deck renames — every
        # Verify Live since #1722 was red for that reason, not because the deck was stale. SITE is passed and the marker is
        # the deck's own HUD node, which no revision renames.
        env:
          SITE: https://exel-ai-polling.explore-096.workers.dev
        run: |
          REV=$(sed -n "s/^export const DECK_REV = '\([0-9]*\)';.*/\1/p" frontend/tests/deck-head.mjs)
          body=$(curl -fsSL -H 'cache-control: no-cache' "$SITE/drone-2525/play.html")
          echo "$body" | grep -q "revision:'0.$REV'" || { echo "::error::/drone-2525/play.html does not carry revision 0.$REV (a soft-404 returns the SPA with 200)"; echo "### ❌ /drone-2525/play.html is not deck r.$REV" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          echo "$body" | grep -q 'id="playHud"' || { echo '::error::the served deck lacks its own markup'; exit 1; }
          # r.196: the link the QR sheet prints (play.html?range=21&role=turret&mode=train-up) must serve the same deck, not the SPA shell
          qr=$(curl -fsSL -H 'cache-control: no-cache' "$SITE/drone-2525/play.html?range=21&role=turret&mode=train-up")
          echo "$qr" | grep -q "revision:'0.$REV'" || { echo "::error::the QR link play.html?range=21&role=turret&mode=train-up does not serve deck r.$REV"; exit 1; }
          WANT_SHA=$(grep -E "^\| r\.$REV \|" docs/drone-2525/operator-deck/REVISIONS.md | tail -1 | awk -F'|' '{gsub(/ /,"",$6); print $6}')
          LIVE_SHA=$(curl -fsSL -H 'cache-control: no-cache' "$SITE/drone-2525/play.html" | sha256sum | cut -c1-64)
          [ -n "$WANT_SHA" ] && [ "$LIVE_SHA" = "$WANT_SHA" ] || { echo "::error::/drone-2525/play.html sha256 $LIVE_SHA is not the register's r.$REV row ($WANT_SHA) — a stale edge can carry the same revision string (r.134, Krishna A)"; exit 1; }
          echo "✅ /drone-2525/play.html sha256 == register r.$REV"

          echo "✅ /drone-2525/play.html serves deck r.$REV"
          echo "### ✅ /drone-2525/play.html serves deck r.$REV" >> "$GITHUB_STEP_SUMMARY"

      # THE LIVE BYTES RUN THEIR OWN QA (fleet r.147, Krishna): the served deck, opened headless, must publish the same
      # row set as the manifest with no page error — a stale edge or a broken chunk goes red here, not on a phone.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Boot QA on the LIVE deck
        working-directory: frontend
        env:
          DECK_URL: https://exel-ai-polling.explore-096.workers.dev/drone-2525/play.html
        run: npm run test:drone-deck-qa