# Is the live site serving main? — the answer, on demand, with NO secrets required.
#
# WHY: the Claude Code sandbox proxy 403s every outbound host, so an agent working there physically cannot
# read the deployed site and must report UNVERIFIED. That is honest but useless on its own. GitHub's runners
# DO have network, so this workflow performs the one check the sandbox can't and records the verdict in the
# Actions API — where the agent CAN read it. "Is it live?" becomes answerable again, by evidence.
#
# Deliberately separate from deploy.yml: that one needs CLOUDFLARE_API_TOKEN and the NEXT_PUBLIC_* secrets.
# This one needs NOTHING. It must never be blocked by missing configuration, because it is the instrument of
# record for whether Cloudflare actually shipped the commit.

name: Verify Live

on:
  push:
    branches: [main]
  workflow_dispatch: {}
  schedule:
    - cron: "*/30 * * * *"     # catch a deploy that silently stops promoting

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      # Cloudflare builds then promotes; give it room before calling it stale. Reports the SHA it actually
      # sees on every attempt, so the log is a deployment timeline rather than a single pass/fail.
      # Hosted migration 036 — measured after every deploy, never assumed (fleet pass 2, Athena). Runs only when the two
      # secrets exist (Settings → Secrets → SUPABASE_URL, SUPABASE_ANON_KEY); a missing migration is a WARNING, not a
      # failure — signing still works on one phone, the hand-off link does not.
      - name: Probe hosted migration 036 (optional)
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_ANON_KEY != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          body="$(curl -sS -m 20 -X POST "$SUPABASE_URL/rest/v1/rpc/sign_envelope_get" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" -H 'content-type: application/json' \
            --data '{"p_token":"probe","p_secret":null,"p_ip_hash":null,"p_user_agent":"verify-live"}' || true)"
          if printf '%s' "$body" | grep -q 'PGRST202'; then
            echo "::warning title=036 MISSING::sign_envelope_get is not on this Supabase — apply migration 036 (Sign Doc → Why can't I sign? → Copy migration SQL)"
            echo "### ⚠ migration 036 not applied on hosted Supabase" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::notice title=036 OK::sign_envelope_get answers on hosted Supabase"
            echo "### ✅ migration 036 answers" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Poll live site for ${{ github.sha }}
        env:
          SITE: https://exel-ai-polling.explore-096.workers.dev
          WANT: ${{ github.sha }}
        run: |
          want7="${WANT:0:7}"
          echo "expecting: $want7"
          for i in $(seq 1 20); do
            html="$(curl -sS -m 20 -H 'cache-control: no-cache' "$SITE" || true)"
            live="$(printf '%s' "$html" | grep -oE 'SHA:[^0-9a-f]*[0-9a-f]{7}' | grep -oE '[0-9a-f]{7}$' | head -1)"
            [ -z "$live" ] && live="$(printf '%s' "$html" | grep -oE '\b[0-9a-f]{7}\b' | head -1)"
            echo "attempt $i/20 — live=${live:-none}"
            if [ "$live" = "$want7" ]; then
              echo "LIVE=$live" >> "$GITHUB_ENV"
              echo "::notice title=LIVE::$SITE is serving $live"
              echo "### ✅ LIVE — \`$live\`" >> "$GITHUB_STEP_SUMMARY"
              echo "$SITE is serving this commit." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 30
          done
          echo "::error title=STALE::expected $want7, site is serving ${live:-nothing}"
          {
            echo "### ❌ STALE"
            echo "Expected \`$want7\`, live site serves \`${live:-nothing}\` after 10 minutes."
            echo ""
            echo "Cloudflare built but did not promote, or the build failed."
            echo "Remedy: Workers & Pages → exel-ai-polling → Deployments → promote newest to 100%,"
            echo "or clear the build cache (Settings → Build → Clear build cache) and retry."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # THE ROUTE, NOT JUST THE ROOT (Round 10, R10-1). For three days "Verify Live passed" meant the site root
      # carried the SHA; it never once requested /drone-2525/, the page the operator keeps pasting. A route that
      # 404s on the live host while the root is green is precisely the failure this workflow exists to catch.
      # Asserted by the arena's own markup (data-drone-ux1), not by any 200 — a soft-404 SPA shell is a 200 too.
      - name: Probe /drone-2525/ on the live site
        env:
          SITE: https://exel-ai-polling.explore-096.workers.dev
        run: |
          code="$(curl -sS -m 20 -o /tmp/drone.html -w '%{http_code}' -H 'cache-control: no-cache' "$SITE/drone-2525/" || echo 000)"
          if [ "$code" = "200" ] && grep -q 'data-drone-ux1' /tmp/drone.html; then
            echo "::notice title=ROUTE::$SITE/drone-2525/ answers 200 with the arena markup"
            echo "### ✅ /drone-2525/ answers (200, arena markup present)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=ROUTE::$SITE/drone-2525/ returned $code (arena markup $(grep -q 'data-drone-ux1' /tmp/drone.html && echo present || echo ABSENT))"
            echo "### ❌ /drone-2525/ does not answer — HTTP $code" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Verify the served operator deck (the playable itself, not just the shell route)
        # r.133: this step ran without SITE since r.131 (curl "No host part") and grepped a label the deck renames — every
        # Verify Live since #1722 was red for that reason, not because the deck was stale. SITE is passed and the marker is
        # the deck's own HUD node, which no revision renames.
        env:
          SITE: https://exel-ai-polling.explore-096.workers.dev
        run: |
          REV=$(sed -n "s/^export const DECK_REV = '\([0-9]*\)';.*/\1/p" frontend/tests/deck-head.mjs)
          body=$(curl -fsSL -H 'cache-control: no-cache' "$SITE/drone-2525/play.html")
          echo "$body" | grep -q "revision:'0.$REV'" || { echo "::error::/drone-2525/play.html does not carry revision 0.$REV (a soft-404 returns the SPA with 200)"; echo "### ❌ /drone-2525/play.html is not deck r.$REV" >> "$GITHUB_STEP_SUMMARY"; exit 1; }
          echo "$body" | grep -q 'id="playHud"' || { echo '::error::the served deck lacks its own markup'; exit 1; }
          WANT_SHA=$(grep -E "^\| r\.$REV \|" docs/drone-2525/operator-deck/REVISIONS.md | tail -1 | awk -F'|' '{gsub(/ /,"",$6); print $6}')
          LIVE_SHA=$(curl -fsSL -H 'cache-control: no-cache' "$SITE/drone-2525/play.html" | sha256sum | cut -c1-64)
          [ -n "$WANT_SHA" ] && [ "$LIVE_SHA" = "$WANT_SHA" ] || { echo "::error::/drone-2525/play.html sha256 $LIVE_SHA is not the register's r.$REV row ($WANT_SHA) — a stale edge can carry the same revision string (r.134, Krishna A)"; exit 1; }
          echo "✅ /drone-2525/play.html sha256 == register r.$REV"

          echo "✅ /drone-2525/play.html serves deck r.$REV"
          echo "### ✅ /drone-2525/play.html serves deck r.$REV" >> "$GITHUB_STEP_SUMMARY"