<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>eXeL AI — Temporarily Paused</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #05121a;
    color: #cbd5e1;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px;
    text-align: center;
  }
  .card {
    max-width: 460px;
    width: 100%;
    border: 1px solid rgba(25, 200, 207, 0.25);
    border-radius: 18px;
    background: rgba(9, 22, 30, 0.7);
    padding: 40px 28px;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
    color: #19c8cf; font-weight: 700; margin-bottom: 18px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #19c8cf; box-shadow: 0 0 12px #19c8cf; }
  h1 { color: #fff; font-size: 26px; line-height: 1.2; margin: 0 0 12px; }
  p { font-size: 15px; line-height: 1.6; margin: 0 0 10px; }
  .muted { color: #64748b; font-size: 13px; margin-top: 22px; }
  a { color: #19c8cf; text-decoration: none; }
</style>
</head>
<body>
  <main class="card">
    <div class="badge"><span class="dot"></span> eXeL AI</div>
    <h1>We&rsquo;ll be right back</h1>
    <p>The platform is paused for a brief maintenance and safety check. Your data is secure.</p>
    <p>The home page remains available while we complete the check.</p>
    <p class="muted">
      Return to <a href="/main">the home page</a>, or check back in a few minutes.
    </p>
  </main>
</body>
</html>
