<title>Vision • 2525 — Recursive Coordination for Human Continuity</title>
<meta name="description" content="Vision • 2525 — an hour of a human life, recorded so it cannot be discounted by where it was lived. Version 17.">
<!--
  /Vision-2525/White-Paper — the canonical home of the document.

  It used to live at /main/Vision-2525, which was the one piece of routing in this
  app that followed no logic. Every other /main/* route is an ALIAS of something
  with a real home elsewhere — /main/SoI-2525 re-exports /innovation, /main/
  Architect-2525 aliases /Architect-2525, /main/experiences aliases /experiences.
  /main is the duplicate-door namespace, and it was holding the front door for the
  most important document in the project. It now sits where it belongs: a child of
  the manifesto at /vision-2525 that introduces it.

  It is a static page rather than a Next.js route, and that is deliberate. The app
  already owns /vision-2525 (the manifesto poster). Two app routes differing only
  in case make webpack refuse to build: "prevent writing to file that only differs
  in casing … corrupted files on case-insensitive file systems." Serving this from
  public/ has no such collision, needs no hydration, and loads the document itself
  in one request instead of behind a React bundle.

  /Vision-2525 and /main/Vision-2525 are now forwarding STUBS, not copies. Stubs
  because next.config.js is output:'export' and a static export cannot redirect;
  not copies because two full copies of this chrome would drift, which is exactly
  the risk the old arrangement carried.

  No login. No account. Nothing to accept.
-->
<style>
  :root{
    --gold:#e8b64c; --cyan:#22d3ee; --bar1:#070c16; --bar2:#0a1020;
    --page:#f7f6f2; --edge:rgba(232,182,76,.28); --mut:#94a3b8;
    color-scheme:light dark;
  }
  html[data-theme="dark"]{--page:#0b1314}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{display:flex;flex-direction:column;background:var(--page);
    font:15px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;padding:10px 16px;z-index:2;
    background:linear-gradient(180deg,var(--bar1) 0%,var(--bar2) 100%);border-bottom:1px solid var(--edge)}
  .mark{width:26px;height:26px;flex:0 0 auto;opacity:.9}
  .id{min-width:0;flex:1 1 180px}
  .id b{display:block;font:700 17px/1.15 "Iowan Old Style",Palatino,Georgia,serif;color:var(--gold);
    letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .id b i{font-style:normal;color:var(--cyan)}
  .id span{display:block;font-size:11.5px;line-height:1.3;color:var(--mut);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .seg{display:flex;overflow:hidden;border:1px solid rgba(148,163,184,.35);border-radius:999px}
  .seg button{appearance:none;border:0;background:none;cursor:pointer;color:var(--mut);
    font:600 12px/1 inherit;padding:8px 12px;display:flex;align-items:center;gap:6px}
  .seg button[aria-pressed="true"]{background:var(--gold);color:#0a1020}
  .btn{display:flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;text-decoration:none;
    font:600 12px/1 inherit;border:1px solid rgba(148,163,184,.35);color:#cbd5e1}
  .btn:hover{color:var(--cyan);border-color:var(--cyan)}
  .btn.pri{background:var(--gold);color:#0a1020;border-color:var(--gold)}
  .btn.pri:hover{color:#0a1020;filter:brightness(1.06)}
  @media(max-width:640px){.btn span,.seg button span{display:none}.btn,.seg button{padding:8px 11px}}
  iframe{flex:1 1 auto;width:100%;min-height:0;border:0;display:block}
  .skip{position:absolute;left:-9999px}
  .skip:focus{left:12px;top:12px;z-index:9;background:var(--gold);color:#0a1020;padding:8px 12px;border-radius:8px}
</style>

<body>
<a class="skip" href="#doc">Skip to the document</a>
<header>
  <svg class="mark" viewBox="0 0 100 100" fill="none" stroke="#22d3ee" stroke-width="3" aria-hidden="true">

    <circle cx="59.5" cy="55.5" r="17"/><circle cx="40.5" cy="55.5" r="17"/>

  </span>
</header>

<iframe id="doc" src="/whitepaper/vision-2525.html"
        title="Vision 2525 — Recursive Coordination for Human Continuity"></iframe>

<script>
/* The document's own stylesheet already treats :root[data-theme] as the authority
   over prefers-color-scheme, so the theme is a single attribute stamped on the
   embedded root. Same origin, so the reach-in is legal.

   Retried rather than fired once on load: a local ~1 MB file can finish loading
   before this script runs, in which case an onload handler would never fire and
   the toggle would be silently dead. Poll until reachable, then stop. */
(function(){
  var frame = document.getElementById("doc"), mode = "light", tries = 0, timer = null;
  function stamp(){
    var d = frame.contentDocument;
    if (d && d.documentElement){ d.documentElement.setAttribute("data-theme", mode); return true; }
    return false;
  }
  function apply(m){
    mode = m;
    document.documentElement.setAttribute("data-theme", m);
    document.getElementById("bLight").setAttribute("aria-pressed", m === "light");
    document.getElementById("bDark").setAttribute("aria-pressed", m === "dark");
    if (timer) clearInterval(timer);
    if (stamp()) return;
    tries = 0;
    timer = setInterval(function(){ if (stamp() || ++tries > 60) clearInterval(timer); }, 50);
  }
  document.getElementById("bLight").onclick = function(){ apply("light"); };
  document.getElementById("bDark").onclick  = function(){ apply("dark"); };
  frame.addEventListener("load", function(){ apply(mode); });
  /* The document owns what "go to the author" means; we click its own byline. */
  document.getElementById("bAuthor").onclick = function(){
    var d = frame.contentDocument, a = d && d.getElementById("authorLink");
    if (a) a.click();
  };
  apply("light");
})();
</script>
</body>
</html>
