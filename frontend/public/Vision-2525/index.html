<!--
  A FORWARDING STUB, deliberately not a second copy of the reader.

  This URL has been handed out, and capitalised is how a person types it, so it

  reader chrome, and a second copy of anything is a promise to keep two things
  in step forever. It forwards instead.

  next.config.js is output:'export'. A static export has no redirects() — there
  is no server to issue a 301. A meta refresh plus rel=canonical is the whole of
  what is available, so that is what this is, said plainly rather than described
  as a redirect.

  The visible link below is not decoration: it is what a reader gets if refresh
  is disabled, if a scraper ignores the meta, or if the page is read as text.
