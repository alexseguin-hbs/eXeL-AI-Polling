<style>
  html,body { margin:0; height:100%; background:#3E505C; color:#fff; font-family:Roboto,system-ui,sans-serif; }

    .grid { display:flex; flex-direction:column; }

    .annotate { width:auto; align-self:center; padding:4px 8px; font-size:11px; }
    .off { padding:8px; font-size:13px; }
    .path, .links { font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    footer { overflow:visible; justify-content:space-between; }
  }
  header, footer { background:#212121; display:flex; align-items:center; flex-wrap:wrap; gap:8px 12px; min-width:0; padding:8px 12px; }
  header { flex-wrap:nowrap; padding-top:max(8px, env(safe-area-inset-top, 0px)); }
  footer { padding-bottom:max(4px, env(safe-area-inset-bottom, 0px)); justify-content:space-between; flex-wrap:nowrap; gap:4px; overflow:visible; position:relative; z-index:8; }

  a.dl { display:inline-flex; align-items:center; justify-content:center; width:31px; height:31px; box-sizing:border-box; padding:6px; border-radius:8px; border:1px solid #d18be0; color:#d18be0; text-decoration:none; }

<script>
/* Same detection path as Demo90/TFLite_detection_webcam.py, on a phone or a PC.
   Coral's edgetpu.tflite cannot run in a browser. This file runs detect.tflite. */
(function () {
  var CORE = "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-core@4.22.0/dist/tf-core.min.js";
  var CPU = "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-cpu@4.22.0/dist/tf-backend-cpu.min.js";
  var TFLITE = "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.10/dist/tf-tflite.min.js";
  var WASM = "https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-tflite@0.0.1-alpha.10/wasm/";
  var BASE = "https://raw.githubusercontent.com/De-Risking-Strategies/SensorFusion/master/";
  var catalogPromise = null;
  var readyPromise = null;

  function script(src) {
    return new Promise(function (resolve, reject) {
      var found = document.querySelector('script[src="' + src + '"]');
      if (found) {
        resolve();
        return;
      }
      var tag = document.createElement("script");
      tag.src = src;
      tag.async = true;
      tag.onload = function () { resolve(); };
      tag.onerror = function () { reject(new Error("Could not load the model runner.")); };
      document.head.appendChild(tag);
    });
  }

  function ready() {
    if (!readyPromise) {
      readyPromise = script(CORE).then(function () { return script(CPU); }).then(function () { return script(TFLITE); }).then(function () {
        return window.tf.setBackend("cpu").then(function () { return window.tf.ready(); });
      }).then(function () {
        if (window.tflite && window.tflite.setWasmPath) window.tflite.setWasmPath(WASM);
      });
    }
    return readyPromise;
  }

  function asList(output, model) {
    if (!output) return [];
    if (output.shape) return [output];
    var names = (model.outputs || []).map(function (item) { return item.name; });
    var fromNames = names.map(function (name) { return output[name]; }).filter(Boolean);
    if (fromNames.length) return fromNames;
    return Object.keys(output).map(function (key) { return output[key]; });
  }

  function catalog() {
    if (!catalogPromise) {
      if (window.SF_CATALOG && window.SF_CATALOG.models) {
        catalogPromise = Promise.resolve(window.SF_CATALOG);
      } else {
        catalogPromise = fetch("/sensor-fusion/models.json").then(function (res) {
          if (!res.ok) throw new Error("The model list did not open.");
          return res.json();
        });
      }
    }
    return catalogPromise;
  }

  /* One label rule for every reader: a first line of ??? is dropped before the class number is looked up,
     as TFLite_detection_webcam.py does (del labels[0]). Class 0 is then person on Demo.90.
     A label map with no ??? first line is used as it is. */
  function labelList(text) {
    var labels = String(text || "").replace(/\r/g, "").split("\n").map(function (line) { return line.trim(); });
    if (labels.length && labels[labels.length - 1] === "") labels.pop();
    if (labels.length && labels[0] === "???") labels.shift();
    return labels;
  }

  async function load(id) {
    var data = await catalog();
    var row = (data.models || []).filter(function (item) { return item.id === id; })[0];
    if (!row || !row.remote) throw new Error("That model is not in the list.");
    var folder = row.remote;
    await ready();
    var labels = labelList(await (await fetch(BASE + folder + "labelmap.txt")).text());
    var model = await window.tflite.loadTFLiteModel(BASE + folder + "detect.tflite");
    var shape = model.inputs[0].shape;
    return {
      model: model,
      labels: labels,
      height: shape[1],
      width: shape[2],
      dtype: String(model.inputs[0].dtype || "")
    };
  }

  async function detect(session, video) {
    var tf = window.tf;
    var started = performance.now();
    var pixels = tf.browser.fromPixels(video);
    var resized = tf.image.resizeBilinear(pixels, [session.height, session.width]);
    var input = session.dtype.indexOf("float") >= 0
      ? tf.tidy(function () { return tf.expandDims(tf.div(tf.sub(resized, 127.5), 127.5), 0); })
      : tf.tidy(function () { return tf.expandDims(tf.cast(tf.clipByValue(tf.round(resized), 0, 255), "int32"), 0); });
    var output = session.model.predict(input);
    pixels.dispose();
    resized.dispose();
    input.dispose();
    var tensors = asList(output, session.model);
    var boxes = await tensors[0].data();
    var classes = await tensors[1].data();
    var scores = await tensors[2].data();
    var count = scores.length;
    if (tensors[3]) {
      var counted = await tensors[3].data();
      var found = Math.round(counted[0]);
      if (found > 0 && found < count) count = found;
    }
    tensors.forEach(function (tensor) { if (tensor && tensor.dispose) tensor.dispose(); });
    var hits = [];
    for (var i = 0; i < count; i += 1) {
      var score = scores[i];
      if (score > 0.5 && score <= 1) {
        var classId = Math.round(classes[i]);
        var name = session.labels[classId] || "";
        if (!name || name === "???") continue;
        hits.push({
          ymin: boxes[i * 4],
          xmin: boxes[i * 4 + 1],
          ymax: boxes[i * 4 + 2],
          xmax: boxes[i * 4 + 3],
          score: score,
          name: name
        });
      }
    }
    return { hits: hits, fps: 1000 / Math.max(performance.now() - started, 1) };
  }

  function draw(canvas, video, result, showScores, showLabels, showFps) {
    var frameW = video.videoWidth || 640;
    var frameH = video.videoHeight || 480;
    var cssW = video.clientWidth || canvas.clientWidth || frameW;
    var cssH = video.clientHeight || canvas.clientHeight || frameH;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var width = Math.max(1, Math.round(cssW * dpr));
    var height = Math.max(1, Math.round(cssH * dpr));
    if (canvas.width !== width) canvas.width = width;
    if (canvas.height !== height) canvas.height = height;
    var pen = canvas.getContext("2d");
    if (!pen) return;
    pen.setTransform(1, 0, 0, 1, 0, 0);
    pen.clearRect(0, 0, width, height);
    var scale = Math.max(width / frameW, height / frameH);
    var originX = (width - frameW * scale) / 2;
    var originY = (height - frameH * scale) / 2;
    var fontPx = Math.round(15 * dpr);
    pen.lineWidth = Math.max(1, 2 * dpr);
    pen.font = "600 " + fontPx + "px sans-serif";
    var labelH = Math.round(fontPx * 1.25);
    result.hits.forEach(function (hit) {
      var x = originX + hit.xmin * frameW * scale;
      var y = originY + hit.ymin * frameH * scale;
      var w = Math.max(1, (hit.xmax - hit.xmin) * frameW * scale);
      var h = Math.max(1, (hit.ymax - hit.ymin) * frameH * scale);
      pen.strokeStyle = (getComputedStyle(document.documentElement).getPropertyValue("--sf-primary") || "#0cff00").trim() || "#0cff00";
      pen.strokeRect(x, y, w, h);
      var text = (showLabels ? hit.name : "") + (showScores ? (showLabels && hit.name ? " " : "") + Math.round(hit.score * 100) + "%" : "");
      if (text) {
        pen.fillStyle = "#ffffff";
        var pad = pen.measureText(text).width + Math.round(fontPx * 0.6);
        var top = Math.max(0, y - labelH);
        pen.fillRect(x, top, pad, labelH);
        pen.fillStyle = "#000000";
        pen.fillText(text, x + Math.round(fontPx * 0.3), top + Math.round(fontPx * 0.95));
      }
    });
    if (showFps) {
      pen.fillStyle = "#ffe600";
      pen.font = "600 " + fontPx + "px sans-serif";
      pen.fillText("FPS: " + result.fps.toFixed(2), fontPx, fontPx * 2);
    }
  }

  window.SFCnn = { load: load, detect: detect, draw: draw, labelList: labelList };
})();

</script>

  const lenses = EDGE.lenses || [];
  for (var i = 0; i < lenses.length; i += 1) {
    if (new RegExp(lenses[i].match, "i").test(name)) return lenses[i].name;
  }
  if (!name) return total > 1 ? "Camera " + (index + 1) : "Camera";
  return name.replace(/\s*\([^)]*\)\s*/g, "").trim() || ("Camera " + (index + 1));
}
function paint(){
  $("logo").src = IMG.logo;
  $("tog").src = sensorOn ? IMG.on : IMG.off;
  $("infoImg").src = IMG.info;
  $("setImg").src = IMG.settings;
  $("fullImg").src = IMG.full;
  $("scoresImg").src = showScores ? IMG.on : IMG.off;
  $("labelsImg").src = showLabels ? IMG.on : IMG.off;
  $("annImg").src = IMG.capture;
  $("modelImg").src = IMG.models;
  $("upImg").src = IMG.train;
  if (IMG.tutorial) $("tutorial").src = IMG.tutorial;
  const picked = sensors.find(function (item) { return item.id === sensorId; });
  const name = picked ? " · " + picked.name : "";
  $("sensorLabel").textContent = "SENSOR 1: " + (sensorOn ? "ON" : "OFF") + name;
  $("off").classList.toggle("hide", sensorOn);
  $("fps").classList.toggle("hide", !showFps);
  $("scores").classList.toggle("on", showScores);
  $("labels").classList.toggle("on", showLabels);
}
function fillModels(){
  const list = $("modelList");
  list.innerHTML = MODELS.map(m => '<li><button type="button" data-id="'+m[0]+'">'+(m[0]===model?"✓ ":"")+m[1]+'</button></li>').join("");
  list.querySelectorAll("button").forEach(btn => {
    btn.onclick = () => { model = btn.getAttribute("data-id"); $("modelList").classList.add("hide"); paint(); if (sensorOn) runCnn(); };
  });
  const m = current();
  $("modelName").textContent = m[1];
}
async function listSensors(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return [];
  const devices = await navigator.mediaDevices.enumerateDevices();
  const cams = devices.filter(function (device) { return device.kind === "videoinput"; });
  return cams.map(function (device, index) {
    return { id: device.deviceId, name: sensorTitle(device.label, index, cams.length) };
  });
}
function paintSensors(){
  const box = $("sensorPick");
  if (!box) return;
  if (sensors.length < 2) { box.classList.add("hide"); return; }
  box.classList.remove("hide");
  box.innerHTML = sensors.map(function (item) {
    return '<option value="' + item.id + '"' + (item.id === sensorId ? " selected" : "") + ">" + item.name + "</option>";
  }).join("");
}
async function openCam(deviceId){
  if (location.protocol === "file:" && (platform === "iphone" || platform === "android")) {
    alert("This phone opens the camera from the Sensor Fusion link, not from a saved file.");
    return;
  }
  try {
    if (stream) stream.getTracks().forEach(function (track) { track.stop(); });
    const video = deviceId ? { deviceId: { exact: deviceId } } : { facingMode: "environment" };
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: video });
    } catch (err) {
      if (deviceId) throw err;
      stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: true });
    }
    $("cam").srcObject = stream;
    await $("cam").play();
    sensors = await listSensors();
    const trackId = stream.getVideoTracks()[0] && stream.getVideoTracks()[0].getSettings().deviceId;
    sensorId = deviceId || trackId || (sensors[0] && sensors[0].id) || "";
    sensorOn = true;
    paintSensors();
    runCnn();
  } catch (err) {
    sensorOn = false;
    alert("The camera did not open. Allow the camera for this page, then try SENSOR 1 again.");
  }
  paint();
}
function closeCam(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  $("cam").srcObject = null;
  sensorOn = false;
  cnnToken += 1;
  var fill = $("meterFill");
  if (fill) fill.style.height = "0%";
  paint();
}
let cnnToken = 0;
async function runCnn(){
  const token = ++cnnToken;
  if (!window.SFCnn) return;
  try {
    const session = await window.SFCnn.load(model);
    const loop = async () => {
      if (token !== cnnToken || !sensorOn) return;
      const video = $("cam");
      if (video.readyState >= 2) {
        const result = await window.SFCnn.detect(session, video);
        window.SFCnn.draw($("boxes"), video, result, showScores, showLabels, showFps);
        var best = 0;
        (result.hits || []).forEach(function (hit) { if (hit.score > best) best = hit.score; });
        var fill = $("meterFill");
        if (fill) {
          fill.style.height = Math.round(best * 100) + "%";
          fill.style.background = best >= 0.7 ? "#0cff00" : best >= 0.5 ? "#ffe600" : "#ff3b30";
        }
      }
      if (token === cnnToken) setTimeout(loop, 40);
    };
    loop();
  } catch (err) {
    alert((err && err.message) || "The model did not start.");
  }
}
function openSheet(title, html, links){
  $("sheetTitle").textContent = title;
  $("menuBody").innerHTML = html;
  $("menuBody").classList.remove("hide");
  $("formBody").classList.add("hide");
  $("sheetLinks").innerHTML = links;
  $("sheet").classList.remove("hide");
}
function closeSheet(){ $("sheet").classList.add("hide"); }
function showMenu(){
  const opts = PLATFORMS.map(p => '<option value="'+p.id+'"'+(p.id===platform?' selected':'')+'>'+p.label+'</option>').join("");
  const items = MENU.map(item => '<button type="button" data-n="'+item[0]+'" style="display:block;width:100%;text-align:left;margin:6px 0;padding:8px">'+item[0]+'  '+item[1]+'</button>').join("");
  openSheet("Menu",
    '<label>This device <select id="plat">'+opts+'</select></label>'+
    '<label><input id="coralSwitch" type="checkbox"'+(coral?' checked':'')+'> Coral</label>'+items+
    '<p>This file runs on a Raspberry Pi, Ubuntu, a Windows PC, a Mac, an iPhone, or an Android phone. Files stay in ' + homeFolder() + '.</p>'+
    '<p id="folderLine">Files: ' + folderPath() + '</p>',
    '<button type="button" id="closeSheet">Close</button>');
  $("plat").onchange = (e) => {
    platform = e.target.value;
    const line = $("folderLine");
    if (line) line.textContent = "Files: " + folderPath();
    paint();
  };
  $("coralSwitch").onchange = (e) => { coral = e.target.checked; };
  $("menuBody").querySelectorAll("button[data-n]").forEach(btn => {
    btn.onclick = () => pick(MENU.find(m => m[0] === btn.getAttribute("data-n")));
  });
  $("closeSheet").onclick = closeSheet;
}
function pick(item){
  if (item[2] === "stop") { closeCam(); closeSheet(); return; }
  if (item[2] === "pose") {
    openSheet("Pose", "<p>Pose is not designed yet. It does not have the three files the other models use.</p>", '<button type="button" id="backMenu">Back</button>');
    $("backMenu").onclick = showMenu;
    return;
  }
  fillModels();
  closeSheet();
  paint();
  if (item[2] === "label") { showLabel(); return; }
}
function showLabel(){
  openSheet("Image labeler",
    '<p>Add a picture the team collected. Name it, then set the left, top, right and bottom of the box. 0 is the edge. 100 is the far edge.</p>'+
    '<input id="labFile" type="file" accept="image/*">'+
    '<div id="labStage" style="position:relative;margin-top:8px"><img id="labPic" alt="" style="width:100%;display:none"><div id="labBox" style="position:absolute;border:2px solid #0cff00;display:none"></div></div>'+
    '<label>Label name <input id="labName" value="deer"></label>'+
    '<label>Left <input id="labL" type="number" min="0" max="100" value="20"></label>'+
    '<label>Top <input id="labT" type="number" min="0" max="100" value="15"></label>'+
    '<label>Right <input id="labR" type="number" min="0" max="100" value="70"></label>'+
    '<label>Bottom <input id="labB" type="number" min="0" max="100" value="80"></label>',
    '<button type="button" id="labSave">SAVE BOX</button><button type="button" id="backMenu">Menu</button>');
  const draw = () => {
    const pic = $("labPic");
    const box = $("labBox");
    if (!pic.src) return;
    const l = Math.min(+$("labL").value, +$("labR").value);
    const t = Math.min(+$("labT").value, +$("labB").value);
    const w = Math.abs(+$("labR").value - +$("labL").value);
    const h = Math.abs(+$("labB").value - +$("labT").value);
    box.style.display = "block";
    box.style.left = l + "%";
    box.style.top = t + "%";
    box.style.width = w + "%";
    box.style.height = h + "%";
  };
  ["labL","labT","labR","labB"].forEach(id => { $(id).oninput = draw; });
  $("labFile").onchange = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => { $("labPic").src = reader.result; $("labPic").style.display = "block"; draw(); };
    reader.readAsDataURL(file);
  };
  $("labSave").onclick = () => {
    const row = { name: $("labName").value || "deer", left: +$("labL").value, top: +$("labT").value, right: +$("labR").value, bottom: +$("labB").value };
    const blob = new Blob([JSON.stringify(row, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (row.name || "label") + "-box.json";
    a.click();
    URL.revokeObjectURL(a.href);
  };
  $("backMenu").onclick = showMenu;
}
function showAnnotate(){
  $("sheetTitle").textContent = "Save pictures";
  $("menuBody").classList.add("hide");
  $("formBody").classList.remove("hide");
  $("sheetLinks").innerHTML = '<button type="button" id="saveShots">SUBMIT</button><button type="button" id="cancelShots">CANCEL</button>';
  $("sheet").classList.remove("hide");
  $("cancelShots").onclick = closeSheet;
  $("saveShots").onclick = saveShots;
}
async function saveShots(){
  const video = $("cam");
  if (!sensorOn) { alert("Turn SENSOR 1 on before you save pictures."); return; }
  const howMany = Math.min(12, Math.max(1, Number($("count").value) || 1));
  shots = [];
  for (let i = 0; i < howMany; i++) {
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext("2d").drawImage(video, 0, 0);
    const name = ($("name").value || "capture") + "-" + (i+1) + ".png";
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/png");
    a.download = name;
    a.click();
    shots.push(name);
    await new Promise(r => setTimeout(r, 150));
  }
  openSheet("Pictures saved on this phone", "<p>"+shots.length+" pictures were saved here. On the website you can send them.</p>", '<button type="button" id="closeSheet">Close</button>');
  $("closeSheet").onclick = closeSheet;
}
$("logo").onclick = showMenu;
$("sensor").onclick = () => sensorOn ? closeCam() : openCam();
$("sensorPick").onchange = (e) => { sensorId = e.target.value; openCam(sensorId); };
$("scores").onclick = () => { showScores = !showScores; paint(); };
$("labels").onclick = () => { showLabels = !showLabels; paint(); };
$("modelBtn").onclick = () => $("modelList").classList.toggle("hide");
$("annotate").onclick = showAnnotate;
$("upload").onclick = saveShots;
$("infoBtn").onclick = () => { $("tutorial").classList.toggle("hide"); };
$("tutorial").onclick = () => $("tutorial").classList.add("hide");
$("setBtn").onclick = showMenu;
$("fullBtn").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
};
$("sheet").onclick = (e) => { if (e.target === $("sheet")) closeSheet(); };
$("cam").onclick = () => { showFps = !showFps; paint(); };
document.addEventListener("keydown", (e) => {
  if (e.key === "f" || e.key === "F") {
    var field = e.target;
    if (field && (field.tagName === "INPUT" || field.tagName === "TEXTAREA" || field.tagName === "SELECT")) return;
    showFps = !showFps;
    paint();
  }
});
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  navigator.serviceWorker.register("/sf-offline-sw.js").catch(function () {});
}
fillModels();
paint();
showMenu();
function fitScreen() {
  var view = window.visualViewport;
  var grid = document.querySelector(".grid");
  if (!view || !grid) return;
  grid.style.position = "fixed";
  grid.style.left = Math.round(view.offsetLeft) + "px";
  grid.style.top = Math.round(view.offsetTop) + "px";
  grid.style.width = Math.round(view.width) + "px";
  grid.style.height = Math.round(view.height) + "px";
}
fitScreen();
window.addEventListener("resize", fitScreen);
window.addEventListener("orientationchange", fitScreen);
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", fitScreen);
  window.visualViewport.addEventListener("scroll", fitScreen);
}
</script>
</body>
</html>
