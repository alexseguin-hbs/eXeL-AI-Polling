<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sensor Fusion</title>
<style>
  html,body { margin:0; height:100%; background:#3E505C; color:#fff; font-family:Roboto,system-ui,sans-serif; }
  .grid { display:grid; grid-template-rows:auto minmax(0,1fr) auto auto; height:100dvh; height:100svh; width:100%; box-sizing:border-box; padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px); }
  @media (orientation: landscape) and (max-height: 520px) {
    .grid { grid-template-columns: 1fr minmax(200px, 34vw); grid-template-rows: auto minmax(0,1fr) auto; }
    header { grid-column: 1 / -1; }
    main { grid-column: 1; grid-row: 2; }
    footer { grid-column: 2; grid-row: 2; flex-direction: column; align-items: stretch; overflow: auto; }
    .path { grid-column: 1 / -1; }
  }
  header, footer { background:#212121; display:flex; align-items:center; flex-wrap:wrap; gap:8px 12px; min-width:0; padding:8px 12px; }
  header { padding-top:max(8px, env(safe-area-inset-top, 0px)); }
  footer { padding-bottom:max(8px, env(safe-area-inset-bottom, 0px)); justify-content:space-around; }
  header img.logo { height:22px; width:auto; max-width:120px; object-fit:contain; }
  #sensor { display:flex; align-items:center; gap:8px; background:none; border:0; color:#fff; font-size:clamp(14px, 4vw, 22px); font-weight:700; cursor:pointer; }
  .icons { margin-left:auto; display:flex; gap:10px; align-items:center; }
  a.dl { width:32px; height:32px; display:inline-flex; align-items:center; justify-content:center; border:1px solid #9be7ff; color:#9be7ff; border-radius:8px; text-decoration:none; }
  a.dl svg { width:16px; height:16px; }
  .icons button, footer button { background:none; border:0; color:#fff; cursor:pointer; font-size:12px; display:flex; flex-direction:column; align-items:center; justify-content:center; min-width:32px; min-height:32px; }
  .icons img, #sensor img, footer img, .annotate img { height:16px; width:16px; object-fit:contain; }
  main { position:relative; background:#3E505C; min-height:0; }
  video, #boxes { width:100%; height:100%; object-fit:cover; background:#000; }
  #boxes { position:absolute; inset:0; background:transparent; pointer-events:none; }
  .off { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .fps { position:absolute; left:16px; top:16px; color:#ffe600; font-weight:700; margin:0; }
  footer select, .sheet select, .sheet input { font-size:16px; }
  .path { background:#212121; margin:0; padding:4px 12px 8px; font-size:12px; color:#d0d0d0; }
  .on { color:#b6ffb0; }
  .sheet { position:fixed; inset:0; background:rgba(0,0,0,.55); display:flex; align-items:center; justify-content:center; }
  .card { background:#f4f4f4; color:#212121; width:min(440px,92vw); border-radius:8px; padding:16px; }
  .card h2 { margin:0 0 8px; }
  .card label { display:block; margin:8px 0; font-size:14px; }
  .card button, .links a { margin-right:8px; }
  .links { display:flex; gap:12px; flex-wrap:wrap; margin-top:8px; }
  .links a { color:#9be7ff; }
  .hide { display:none; }
</style>
</head>
<body>
<div class="grid">
  <header>
    <img class="logo" id="logo" alt="sensor fusion">
    <button id="sensor" type="button"><img id="tog" alt=""><span id="sensorLabel">SENSOR 1: OFF</span></button>
    <div class="icons">
      <a class="dl" href="/sensor-fusion/download/sensor_fusion_edge.py" title="Download the program" aria-label="Download the program"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="M6 9l6 6 6-6"/><path d="M5 21h14"/></svg></a>
      <button type="button" id="infoBtn" aria-label="Info"><img id="infoImg" alt=""></button>
      <button type="button" id="setBtn" aria-label="Settings"><img id="setImg" alt=""></button>
      <button type="button" id="fullBtn" aria-label="Full screen"><img id="fullImg" alt=""></button>
    </div>
  </header>
  <main>
    <video id="cam" autoplay muted playsinline></video>
    <canvas id="boxes"></canvas>
    <div class="off" id="off">
      <p>Camera Sensor 1 is OFF</p>
      <p>1. Make sure the camera is connected</p>
      <p>2. Toggle SENSOR 1 to ON</p>
    </div>
    <p class="fps hide" id="fps">FPS — measured when the model runs on this device</p>
  </main>
  <footer>
    <button type="button" id="scores"><img id="scoresImg" alt=""><span>%</span></button>
    <button type="button" id="labels"><img id="labelsImg" alt=""><span>Labels</span></button>
    <label>Model<br><select id="model"></select></label>
    <button type="button" id="annotate" class="annotate" aria-label="Annotate"><img id="annImg" alt=""></button>
    <button type="button" id="upload"><img id="upImg" alt=""><span>Upload Images</span></button>
  </footer>
  <p class="path" id="path"></p>
</div>
<div class="sheet hide" id="sheet">
  <div class="card" role="dialog" aria-label="Sensor Fusion">
    <h2 id="sheetTitle">Menu</h2>
    <div id="menuBody"></div>
    <div id="formBody" class="hide">
      <label>Name <input id="name"></label>
      <label>How many <input id="count" value="4"></label>
      <label>Note <input id="note"></label>
    </div>
    <div class="links" id="sheetLinks"></div>
  </div>
</div>
<script src="/sensor-fusion/cnn.js"></script>

const PLATFORMS = [
  { id:"pi", label:"Raspberry Pi", sep:"/" },
  { id:"ubuntu", label:"Ubuntu", sep:"/" },
  { id:"win", label:"Windows PC", sep:"\\" },
  { id:"mac", label:"Mac", sep:"/" },
  { id:"iphone", label:"iPhone", sep:"/" },
  { id:"android", label:"Android", sep:"/" }
];
const MODELS = [
  ["demo90","Demo.90","Demo90","person, bicycle, car"],
  ["deer","Deer","Model01.Deer","deer"],
  ["head","Head","Model02.Head","head"],
  ["eyes","Eyes","Model03.Eyes","eyes"],
  ["tree","Tree","Model04.Tree","tree"],
  ["custom01","Custom.01","Custom.01","the everyday list"],
  ["custom02","Custom.02","Custom.02","the everyday list"],
  ["custom03","Custom.03","Custom.03","the everyday list"],
  ["custom04","Custom.04","Custom.04","the everyday list"],
  ["checkid","Check ID","checkid","Alex, Dara, Nick"],
  ["thermal01","Thermal.01","thermal01","dog, person"]
];
const MENU = [
  ["1","Sensor Fusion, with Coral", true, "demo90", "work"],
  ["2","Sensor Fusion, no Coral", false, "demo90", "work"],
  ["3","Stop", false, "", "stop"],
  ["4","Image labeler", false, "demo90", "label"],
  ["5","Check ID, with Coral", true, "checkid", "work"],
  ["6","Check ID, no Coral", false, "checkid", "work"],
  ["7","Pose", false, "", "pose"]
];
let platform = detect();
let model = "demo90";
let coral = false;
let sensorOn = false;
let showScores = true;
let showLabels = true;
let showFps = false;
let stream = null;
let shots = [];
const $ = (id) => document.getElementById(id);
function detect(){
  const ua = navigator.userAgent || "";
  if (/Android/i.test(ua)) return "android";
  if (/iPhone|iPad/i.test(ua)) return "iphone";
  if (/Windows/i.test(ua)) return "win";
  if (/Linux/i.test(ua)) return "ubuntu";
  return "win";
}
function sep(){ return PLATFORMS.find(p => p.id === platform).sep; }
function current(){ return MODELS.find(m => m[0] === model); }
function fileName(){ return coral ? "edgetpu.tflite" : "detect.tflite"; }
function folderPath(){
  const m = current();
  return ["Home","SensorFusion", m[2], "Sample_TFLite_model", fileName()].join(sep());
}
function paint(){
  $("logo").src = IMG.logo;
  $("tog").src = sensorOn ? IMG.on : IMG.off;
  $("infoImg").src = IMG.info;
  $("setImg").src = IMG.settings;
  $("fullImg").src = IMG.full;
  $("scoresImg").src = showScores ? IMG.on : IMG.off;
  $("labelsImg").src = showLabels ? IMG.on : IMG.off;
  $("annImg").src = IMG.capture;
  $("upImg").src = IMG.train;
  $("sensorLabel").textContent = "SENSOR 1: " + (sensorOn ? "ON" : "OFF");
  $("off").classList.toggle("hide", sensorOn);
  $("fps").classList.toggle("hide", !showFps);
  $("scores").classList.toggle("on", showScores);
  $("labels").classList.toggle("on", showLabels);
  const m = current();
  $("path").textContent = folderPath() + (showLabels ? " · " + m[3] : "") + (showScores ? " · %" : "") + (coral ? " · Coral" : " · no Coral");
}
function fillModels(){
  const sel = $("model");
  sel.innerHTML = MODELS.map(m => '<option value="'+m[0]+'">'+m[1]+'</option>').join("");
  sel.value = model;
}
async function openCam(){
  try {
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({ audio:false, video:true });
    $("cam").srcObject = stream;
    await $("cam").play();
    sensorOn = true;
    runCnn();
  } catch (err) {
    sensorOn = false;
    alert("The camera did not open. Allow the camera for this page, then try SENSOR 1 again.");
  }
  paint();
}
function closeCam(){
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  $("cam").srcObject = null;
  sensorOn = false;
  cnnToken += 1;
  paint();
}
let cnnToken = 0;
async function runCnn(){
  const token = ++cnnToken;
  if (!window.SFCnn) return;
  try {
    const session = await window.SFCnn.load(model);
    const loop = async () => {
      if (token !== cnnToken || !sensorOn) return;
      const video = $("cam");
      if (video.readyState >= 2) {
        const result = await window.SFCnn.detect(session, video);
        window.SFCnn.draw($("boxes"), video, result, showScores, showLabels, true);
      }
      if (token === cnnToken) setTimeout(loop, 40);
    };
    loop();
  } catch (err) {
    $("path").textContent = (err && err.message) || "The model did not start.";
  }
}
function openSheet(title, html, links){
  $("sheetTitle").textContent = title;
  $("menuBody").innerHTML = html;
  $("menuBody").classList.remove("hide");
  $("formBody").classList.add("hide");
  $("sheetLinks").innerHTML = links;
  $("sheet").classList.remove("hide");
}
function closeSheet(){ $("sheet").classList.add("hide"); }
function showMenu(){
  const opts = PLATFORMS.map(p => '<option value="'+p.id+'"'+(p.id===platform?' selected':'')+'>'+p.label+'</option>').join("");
  const items = MENU.map(item => '<button type="button" data-n="'+item[0]+'" style="display:block;width:100%;text-align:left;margin:6px 0;padding:8px">'+item[0]+'  '+item[1]+'</button>').join("");
  openSheet("Menu",
    '<label>This device <select id="plat">'+opts+'</select></label>'+items+
    '<p>This file is the screen. It runs on a Raspberry Pi, Ubuntu, a Windows PC, an iPhone, or an Android phone. The model stays in the folder on that device.</p>',
    '<button type="button" id="closeSheet">Close</button>');
  $("plat").onchange = (e) => { platform = e.target.value; paint(); };
  $("menuBody").querySelectorAll("button[data-n]").forEach(btn => {
    btn.onclick = () => pick(MENU.find(m => m[0] === btn.getAttribute("data-n")));
  });
  $("closeSheet").onclick = closeSheet;
}
function pick(item){
  if (item[4] === "stop") { closeCam(); closeSheet(); return; }
  if (item[4] === "pose") {
    openSheet("Pose", "<p>Pose is not designed yet. It does not have the three files the other models use.</p>", '<button type="button" id="backMenu">Back</button>');
    $("backMenu").onclick = showMenu;
    return;
  }
  coral = item[2];
  if (item[3]) model = item[3];
  $("model").value = model;
  closeSheet();
  paint();
  if (item[4] === "label") showAnnotate();
}
function showAnnotate(){
  $("sheetTitle").textContent = "Save pictures";
  $("menuBody").classList.add("hide");
  $("formBody").classList.remove("hide");
  $("sheetLinks").innerHTML = '<button type="button" id="saveShots">SUBMIT</button><button type="button" id="cancelShots">CANCEL</button>';
  $("sheet").classList.remove("hide");
  $("cancelShots").onclick = closeSheet;
  $("saveShots").onclick = saveShots;
}
async function saveShots(){
  const video = $("cam");
  if (!sensorOn) { alert("Turn SENSOR 1 on before you save pictures."); return; }
  const howMany = Math.min(12, Math.max(1, Number($("count").value) || 1));
  shots = [];
  for (let i = 0; i < howMany; i++) {
    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext("2d").drawImage(video, 0, 0);
    const name = ($("name").value || "capture") + "-" + (i+1) + ".jpg";
    const a = document.createElement("a");
    a.href = canvas.toDataURL("image/jpeg", 0.8);
    a.download = name;
    a.click();
    shots.push(name);
    await new Promise(r => setTimeout(r, 150));
  }
  openSheet("Pictures stay on this device", "<p>"+shots.length+" pictures were saved here. Nothing was sent.</p>", '<button type="button" id="closeSheet">Close</button>');
  $("closeSheet").onclick = closeSheet;
}
$("logo").onclick = showMenu;
$("sensor").onclick = () => sensorOn ? closeCam() : openCam();
$("scores").onclick = () => { showScores = !showScores; paint(); };
$("labels").onclick = () => { showLabels = !showLabels; paint(); };
$("model").onchange = (e) => { model = e.target.value; paint(); if (sensorOn) runCnn(); };
$("annotate").onclick = showAnnotate;
$("upload").onclick = () => {
  openSheet("Upload", "<p>Pictures stay on this device until you choose to send them. The folder is "+folderPath()+".</p>", '<button type="button" id="closeSheet">Close</button>');
  $("closeSheet").onclick = closeSheet;
};
$("infoBtn").onclick = () => {
  openSheet("Sensor 1", "<p>"+(coral?"With Coral.":"No Coral.")+" This folder uses "+fileName()+". Press F to show or hide FPS.</p>", '<button type="button" id="closeSheet">Close</button>');
  $("closeSheet").onclick = closeSheet;
};
$("setBtn").onclick = showMenu;
$("fullBtn").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(()=>{});
};
$("sheet").onclick = (e) => { if (e.target === $("sheet")) closeSheet(); };
document.addEventListener("keydown", (e) => {
  if (e.key === "f" || e.key === "F") { showFps = !showFps; paint(); }
});
fillModels();
paint();
showMenu();
</script>
</body>
</html>
