<!--
  A FORWARDING STUB for the document's old address.

  /main/Vision-2525 was where the white paper lived, and it was the one route in
  this app that followed no logic. Every other /main/* route is an ALIAS of
  something with a real home elsewhere:

      /main/SoI-2525        ->  /innovation          (export { default })
      /main/Architect-2525  ->  /Architect-2525, /Architect/2525
      /main/Security-2525   ->  /Security/2525
      /main/experiences     ->  /experiences
      /main/Vision-2525     ->  nothing. It WAS the front door.

  /main is the duplicate-door namespace, and it was holding the primary address
  for the most important document in the project. The document now lives at
  /Vision-2525/White-Paper/, a child of the manifesto at /vision-2525.

  The Next.js route that used to render here (app/main/Vision-2525/page.tsx) is
  deleted, along with the component that existed only to serve it. This file is
  static because output:'export' has no redirects() — there is no server to issue
  a 301, so a meta refresh plus rel=canonical is the whole of what is available.
-->
