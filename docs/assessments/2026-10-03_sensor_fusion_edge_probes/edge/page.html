<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Edge probe</title>
<style>body{margin:0;background:#07141a;color:#e6f3f4;font:14px system-ui}main{max-width:100%;padding:12px}#stage{position:relative}video,canvas{width:100%;max-width:640px;display:block}#ov{position:absolute;left:0;top:0}#bar{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}button,select{font:inherit;padding:8px 12px}#log{font:12px ui-monospace,monospace;white-space:pre-wrap}</style></head>
<body><main>
<div id="bar"><select id="model"></select><select id="then"><option value="">no second layer</option></select>
<select id="mode"><option value="browser">CNN in this browser</option><option value="edge">CNN on the edge node</option></select>
<button id="go">Camera on</button></div>
<div id="stage"><video id="v" playsinline muted></video><canvas id="ov"></canvas></div>
<div id="log"></div>
<script src="/lib/tfjs-core/dist/tf-core.min.js"></script><script src="/lib/tfjs-backend-cpu/dist/tf-backend-cpu.min.js"></script><script src="/lib/tfjs-tflite/dist/tf-tflite.min.js"></script>
<script>
// REFERENCE PROBE — not Sensor Fusion app code. One page, two paths, one envelope.
const $ = (id) => document.getElementById(id), v = $('v'), ov = $('ov');
const SESSION = Math.random().toString(16).slice(2, 10); let seq = 0, running = false;
window.__LOG = [];
const stable = (x) => Array.isArray(x) ? '[' + x.map(stable).join(',') + ']' : x && typeof x === 'object' ? '{' + Object.keys(x).sort().map((k) => JSON.stringify(k) + ':' + stable(x[k])).join(',') + '}' : JSON.stringify(x);
// crypto.subtle exists only in a secure context. A phone opening the Pi's page over plain http (screen mode) has none,
// so the same SHA-256 runs in plain JS there; both give the same hash (checked on load below).
function sha256js(bytes) { const K = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
  const H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19], n = bytes.length, L = ((n + 9 + 63) >> 6) << 6, m = new Uint8Array(L); m.set(bytes); m[n] = 0x80;
  const dv = new DataView(m.buffer); dv.setUint32(L - 4, n * 8); dv.setUint32(L - 8, Math.floor(n / 0x20000000)); const w = new Uint32Array(64), r = (x, k) => (x >>> k) | (x << (32 - k));
  for (let o = 0; o < L; o += 64) { for (let i = 0; i < 16; i++) w[i] = dv.getUint32(o + i * 4); for (let i = 16; i < 64; i++) { const a = w[i - 15], b = w[i - 2]; w[i] = (w[i - 16] + (r(a, 7) ^ r(a, 18) ^ (a >>> 3)) + w[i - 7] + (r(b, 17) ^ r(b, 19) ^ (b >>> 10))) >>> 0; }
    let [a, b, c, d, e, f, g, h] = H; for (let i = 0; i < 64; i++) { const t1 = (h + (r(e, 6) ^ r(e, 11) ^ r(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) >>> 0, t2 = ((r(a, 2) ^ r(a, 13) ^ r(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) >>> 0; h = g; g = f; f = e; e = (d + t1) >>> 0; d = c; c = b; b = a; a = (t1 + t2) >>> 0; }
    H[0] = (H[0] + a) >>> 0; H[1] = (H[1] + b) >>> 0; H[2] = (H[2] + c) >>> 0; H[3] = (H[3] + d) >>> 0; H[4] = (H[4] + e) >>> 0; H[5] = (H[5] + f) >>> 0; H[6] = (H[6] + g) >>> 0; H[7] = (H[7] + h) >>> 0; }
  const out = new Uint8Array(32); H.forEach((v, i) => new DataView(out.buffer).setUint32(i * 4, v)); return out; }
async function sha16(s) { const bytes = new TextEncoder().encode(s); const h = (self.crypto && crypto.subtle) ? new Uint8Array(await crypto.subtle.digest('SHA-256', bytes)) : sha256js(bytes); return Array.from(h).slice(0, 8).map((b) => b.toString(16).padStart(2, '0')).join(''); }
const r = (x, d) => Math.round(x * 10 ** d) / 10 ** d;
const sessions = {};
async function session(name) {
  if (sessions[name]) return sessions[name];
  tflite.setWasmPath('/lib/tfjs-tflite/wasm/');                    // the runtime lives in /wasm/, not /dist/
  const [model, labels] = await Promise.all([tflite.loadTFLiteModel(`/m/${name}/Sample_TFLite_model/detect.tflite`),
    fetch(`/m/${name}/Sample_TFLite_model/labelmap.txt`).then((x) => x.text()).then((t) => t.split('\n').map((l) => l.replace(/\r$/, '')))]);
  const shp = model.inputs[0].shape; return (sessions[name] = { model, labels, h: shp[1], w: shp[2] });
}
async function detectBrowser(name, src, min = 0.5) {
  const s = await session(name);
  const c = document.createElement('canvas'); c.width = s.w; c.height = s.h; c.getContext('2d').drawImage(src, 0, 0, s.w, s.h);
  const px = c.getContext('2d').getImageData(0, 0, s.w, s.h).data, rgb = new Int32Array(s.w * s.h * 3);
  for (let i = 0, j = 0; i < px.length; i += 4) { rgb[j++] = px[i]; rgb[j++] = px[i + 1]; rgb[j++] = px[i + 2]; }
  const x = tf.tensor(rgb, [1, s.h, s.w, 3], 'int32'), t0 = performance.now(), o = s.model.predict(x);   // functional ops only: no chained calls
  const outs = Array.isArray(o) ? o : s.model.outputs.map((d) => o[d.name]);
  const [b, cl, sc, n] = await Promise.all(outs.map((t) => t.data())); const ms = performance.now() - t0; x.dispose(); outs.forEach((t) => t.dispose());
  const boxes = []; for (let i = 0; i < Math.round(n[0]); i++) if (sc[i] >= min) boxes.push({ label: s.labels[Math.round(cl[i])] ?? '?', cls: Math.round(cl[i]), score: r(sc[i], 3), box: [r(b[i * 4], 4), r(b[i * 4 + 1], 4), r(b[i * 4 + 2], 4), r(b[i * 4 + 3], 4)] });
  return { boxes, ms };
}
async function envelope(verb, layers, ms) {
  const env = { v: 1, session: SESSION, peer: 'browser', seq: ++seq, at: Date.now(), verb, authority: 'MARK', payload: { layers, ms: r(ms, 1) } };
  env.hash = await sha16(stable({ verb, layers })); return env;
}
async function runBrowser(src, name, then) {
  const a = await detectBrowser(name, src); const layers = [{ layer: 1, model: name, boxes: a.boxes }]; let ms = a.ms;
  if (then && a.boxes.length) { const [y0, x0, y1, x1] = a.boxes[0].box, W = src.videoWidth || src.naturalWidth || src.width, H = src.videoHeight || src.naturalHeight || src.height;
    const c = document.createElement('canvas'); c.width = Math.max(1, (x1 - x0) * W); c.height = Math.max(1, (y1 - y0) * H); c.getContext('2d').drawImage(src, Math.max(0, x0) * W, Math.max(0, y0) * H, c.width, c.height, 0, 0, c.width, c.height);
    const b = await detectBrowser(then, c); ms += b.ms; layers.push({ layer: 2, model: then, within: 0, boxes: b.boxes }); }
  return envelope(layers.length > 1 ? 'IDENTIFY' : 'DETECT', layers, ms);
}
async function runEdge(src, name, then) {
  const W = src.videoWidth || src.naturalWidth || src.width, H = src.videoHeight || src.naturalHeight || src.height;
  const c = document.createElement('canvas'); c.width = W; c.height = H; c.getContext('2d').drawImage(src, 0, 0);
  const blob = await new Promise((ok) => c.toBlob(ok, 'image/jpeg', 0.85)); const t0 = performance.now();
  const res = await fetch(`/infer?model=${encodeURIComponent(name)}${then ? '&then=' + encodeURIComponent(then) : ''}&peer=browser`, { method: 'POST', body: blob });
  const env = await res.json(); env.round_trip_ms = r(performance.now() - t0, 1); env.bytes_up = blob.size; return env;
}
function draw(env) {
  const W = v.videoWidth, H = v.videoHeight; ov.width = W; ov.height = H; ov.style.width = v.clientWidth + 'px'; const g = ov.getContext('2d'); g.clearRect(0, 0, W, H);
  g.lineWidth = 3; g.font = '20px system-ui'; for (const L of env.payload.layers) for (const bx of L.boxes) { if (L.layer > 1) continue; const [y0, x0, y1, x1] = bx.box; g.strokeStyle = '#f0a020'; g.strokeRect(x0 * W, y0 * H, (x1 - x0) * W, (y1 - y0) * H); g.fillStyle = '#f0a020'; g.fillText(`${bx.label} ${Math.round(bx.score * 100)}% · MARK`, x0 * W + 4, Math.max(20, y0 * H - 6)); }
}
// the start-up chooser: time three frames each way, keep the faster path (the device measures itself, then chooses)
window.choosePath = async (src, name) => {
  const timeIt = async (fn) => { await fn(); const t = []; for (let k = 0; k < 3; k++) { const t0 = performance.now(); await fn(); t.push(performance.now() - t0); } t.sort((x, y) => x - y); return t[1]; };
  const browserMs = await timeIt(() => runBrowser(src, name, ''));
  let edgeMs = Infinity; try { edgeMs = await timeIt(() => runEdge(src, name, '')); } catch { /* no node reachable: the browser path is the only path */ }
  const pick = edgeMs < browserMs * 0.9 ? 'edge' : 'browser';   // a 10% margin so a tie stays on the device (no video leaves it)
  $('mode').value = pick; return { browserMs: r(browserMs, 1), edgeMs: r(edgeMs, 1), pick };
};
window.runBoth = async (url, name, then) => { const img = new Image(); img.src = url; await img.decode(); return { browser: await runBrowser(img, name, then), edge: await runEdge(img, name, then) }; };
async function loop() {
  if (!running) return; const name = $('model').value, then = $('then').value;
  try { const env = $('mode').value === 'edge' ? await runEdge(v, name, then) : await runBrowser(v, name, then); window.__LOG.push(env); if (window.__LOG.length > 200) window.__LOG.shift(); draw(env);
    $('log').textContent = `${env.verb} · ${env.payload.layers.map((l) => l.model + ' ' + l.boxes.length).join(' → ')} · CNN ${env.payload.ms} ms${env.round_trip_ms ? ' · round trip ' + env.round_trip_ms + ' ms' : ''} · #${env.seq} ${env.hash}`; }
  catch (e) { $('log').textContent = String(e); }
  requestAnimationFrame(loop);
}
fetch('/models').then((x) => x.json()).then((m) => { for (const it of m.models) { $('model').add(new Option(it.name, it.name)); $('then').add(new Option('then ' + it.name, it.name)); } window.__MODELS = m; });
$('go').onclick = async () => {
  try { v.srcObject = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' } } }); }   // the back camera on a phone
  catch { v.srcObject = await navigator.mediaDevices.getUserMedia({ audio: false, video: true }); }
  await v.play(); running = true; loop();
};
</script></main></body></html>
